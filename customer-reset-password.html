<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Reset Password | GiftedGift Empire
  </title>

  <meta
    name="description"
    content="Create a new secure password for your GiftedGift Empire customer account."
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          180deg,
          #eef4ff 0%,
          #f8f9fc 55%,
          #ffffff 100%
        );
      color: #222;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow:
        0 10px 35px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      color: #123a8c;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 25px;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 700;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 48px 14px 14px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #123a8c;
      box-shadow:
        0 0 0 3px rgba(18,58,140,0.08);
    }

    .toggle-password {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      margin: 0;
      padding: 7px 9px;
      border: 0;
      background: transparent;
      color: #123a8c;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .requirements {
      margin-top: 16px;
      padding: 14px;
      background: #f7f9fc;
      border: 1px solid #dde3ed;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }

    .requirement {
      color: #777;
    }

    .requirement.valid {
      color: #17662d;
      font-weight: 700;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #123a8c;
      color: #fff;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 20px;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      border: 1px solid #efb4b4;
      color: #941c1c;
    }

    .message.success {
      display: block;
      background: #e9f8ed;
      border: 1px solid #b8e3c2;
      color: #17662d;
    }

    .message.info {
      display: block;
      background: #eef5ff;
      border: 1px solid #c8d9f5;
      color: #123a8c;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 1.8;
    }

    .links a {
      color: #123a8c;
      font-weight: 700;
      text-decoration: none;
    }

  </style>
</head>


<body>

<div class="page">

  <div class="card">

    <div class="brand">
      GiftedGift Empire
    </div>

    <h1>
      Create a New Password
    </h1>

    <p class="intro">
      Choose a strong new password for your
      customer account.
    </p>


    <div
      id="message"
      class="message info"
    >
      Checking your secure reset link...
    </div>


    <form
      id="reset-form"
      style="display:none;"
    >

      <label for="password">
        New Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="password"
        >
          Show
        </button>

      </div>


      <label for="confirm-password">
        Confirm New Password
      </label>

      <div class="password-wrap">

        <input
          type="password"
          id="confirm-password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="confirm-password"
        >
          Show
        </button>

      </div>


      <div class="requirements">

        <div
          id="rule-length"
          class="requirement"
        >
          ○ At least 8 characters
        </div>

        <div
          id="rule-upper"
          class="requirement"
        >
          ○ At least 1 uppercase letter
        </div>

        <div
          id="rule-lower"
          class="requirement"
        >
          ○ At least 1 lowercase letter
        </div>

        <div
          id="rule-number"
          class="requirement"
        >
          ○ At least 1 number
        </div>

        <div
          id="rule-special"
          class="requirement"
        >
          ○ At least 1 special character
        </div>

      </div>


      <button
        type="submit"
        id="submit-button"
        class="submit-button"
      >
        Update Password
      </button>

    </form>


    <div class="links">

      <a href="/customer-login.html">
        Back to Customer Login
      </a>

    </div>

  </div>

</div>


<script>


const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let recoveryReady =
  false;


function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message " +
    type;


  box.textContent =
    text;
}


function validatePassword(
  password
) {

  return {

    length:
      password.length >= 8,

    upper:
      /[A-Z]/.test(
        password
      ),

    lower:
      /[a-z]/.test(
        password
      ),

    number:
      /[0-9]/.test(
        password
      ),

    special:
      /[^A-Za-z0-9]/.test(
        password
      ),

  };
}


function updateRules() {

  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const rules =
    validatePassword(
      password
    );


  const map = {

    length:
      "rule-length",

    upper:
      "rule-upper",

    lower:
      "rule-lower",

    number:
      "rule-number",

    special:
      "rule-special",

  };


  Object
    .entries(
      map
    )
    .forEach(
      (
        [
          rule,
          elementId
        ]
      ) => {

        const element =
          document
            .getElementById(
              elementId
            );


        if (
          rules[
            rule
          ]
        ) {

          element
            .classList
            .add(
              "valid"
            );


          element.textContent =
            "✓ " +
            element.textContent
              .replace(
                /^[○✓]\s*/,
                ""
              );

        } else {

          element
            .classList
            .remove(
              "valid"
            );


          element.textContent =
            "○ " +
            element.textContent
              .replace(
                /^[○✓]\s*/,
                ""
              );

        }

      }
    );


  return (
    rules.length &&
    rules.upper &&
    rules.lower &&
    rules.number &&
    rules.special
  );
}


async function prepareRecoverySession() {

  try {


    /*
      PKCE recovery links may return ?code=...
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const code =
      params.get(
        "code"
      );


    if (
      code
    ) {

      const {
        error
      } =
        await supabaseClient
          .auth
          .exchangeCodeForSession(
            code
          );


      if (
        error
      ) {

        console.error(
          error
        );
      }

    }


    /*
      Supabase may also restore the recovery
      session automatically from the URL.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      error
    ) {

      console.error(
        error
      );
    }


    if (
      data?.session
    ) {

      recoveryReady =
        true;


      document
        .getElementById(
          "reset-form"
        )
        .style.display =
          "block";


      showMessage(
        "Secure reset link verified. You can now create your new password.",
        "success"
      );


      return;

    }


    showMessage(
      "This password-reset link is invalid or has expired. Please request a new reset email.",
      "error"
    );


  } catch (
    error
  ) {


    console.error(
      error
    );


    showMessage(
      "This password-reset link could not be verified. Please request a new reset email.",
      "error"
    );

  }

}


supabaseClient
  .auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {

      if (
        event ===
          "PASSWORD_RECOVERY" ||
        (
          event ===
            "SIGNED_IN" &&
          session
        )
      ) {

        recoveryReady =
          true;


        document
          .getElementById(
            "reset-form"
          )
          .style.display =
            "block";


        showMessage(
          "Secure reset link verified. You can now create your new password.",
          "success"
        );

      }

    }
  );


document
  .getElementById(
    "password"
  )
  .addEventListener(
    "input",
    updateRules
  );


document
  .querySelectorAll(
    ".toggle-password"
  )
  .forEach(
    (
      button
    ) => {

      button
        .addEventListener(
          "click",
          function () {

            const target =
              document.getElementById(
                this.dataset.target
              );


            if (
              target.type ===
              "password"
            ) {

              target.type =
                "text";

              this.textContent =
                "Hide";

            } else {

              target.type =
                "password";

              this.textContent =
                "Show";

            }

          }
        );

    }
  );


document
  .getElementById(
    "reset-form"
  )
  .addEventListener(
    "submit",
    async function (
      event
    ) {

      event.preventDefault();


      if (
        !recoveryReady
      ) {

        showMessage(
          "Your password-reset session is not valid. Please request a new reset link.",
          "error"
        );

        return;
      }


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirm-password"
          )
          .value;


      if (
        !updateRules()
      ) {

        showMessage(
          "Your password must contain at least 8 characters, including uppercase, lowercase, a number and a special character.",
          "error"
        );

        return;
      }


      if (
        password !==
        confirmPassword
      ) {

        showMessage(
          "The two passwords do not match.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "submit-button"
        );


      button.disabled =
        true;


      button.textContent =
        "Updating Password...";


      try {


        const {
          error
        } =
          await supabaseClient
            .auth
            .updateUser({

              password:
                password,

            });


        if (
          error
        ) {

          console.error(
            error
          );


          throw new Error(
            error.message ||
            "Your password could not be updated."
          );
        }


        showMessage(
          "Your password has been changed successfully. You can now sign in with your new password.",
          "success"
        );


        document
          .getElementById(
            "reset-form"
          )
          .style.display =
            "none";


        await supabaseClient
          .auth
          .signOut();


        setTimeout(
          () => {

            window.location.href =
              "/customer-login.html";

          },
          2500
        );


      } catch (
        error
      ) {


        showMessage(
          error instanceof Error
            ? error.message
            : "Your password could not be updated.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "Update Password";

      }

    }
  );


prepareRecoverySession();


</script>


<script
  src="cookie-consent.js"
></script>


</body>

</html>
