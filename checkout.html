<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Secure Checkout | GiftedGift Empire
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .page {
      min-height: 100vh;
      padding: 30px 16px;
    }

    .checkout-card {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .brand {
      text-align: center;
      color: #123a8c;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .checkout-title {
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 22px;
    }

    .product-image {
      width: 100%;
      max-height: 330px;
      object-fit: contain;
      border-radius: 12px;
      background: #f7f7f7;
      margin-bottom: 20px;
    }

    .product-name {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .price-area {
      margin: 18px 0;
    }

    .normal-price {
      font-size: 30px;
      font-weight: 700;
      color: #123a8c;
    }

    .deal-price-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .old-price {
      font-size: 20px;
      color: #777;
      text-decoration: line-through;
    }

    .deal-price {
      font-size: 32px;
      font-weight: 700;
      color: #123a8c;
    }

    .deal-label {
      display: inline-block;
      margin-top: 8px;
      background: #f2bd16;
      color: #111;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .consent-box {
      margin: 24px 0;
      padding: 16px;
      background: #fff8dc;
      border: 1px solid #e6c85c;
      border-radius: 10px;
      line-height: 1.5;
    }

    .consent-box label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
    }

    .consent-box input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    #paypal-button {
      margin-top: 20px;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin: 18px 0;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #9c1c1c;
      border: 1px solid #f2b7b7;
    }

    .message.success {
      display: block;
      background: #e9f8ed;
      color: #17662d;
      border: 1px solid #b8e3c2;
    }

    .loading {
      text-align: center;
      padding: 30px 10px;
      color: #666;
    }

    .download-area {
      display: none;
      margin-top: 25px;
      padding: 18px;
      text-align: center;
      background: #eef5ff;
      border-radius: 12px;
    }

    .download-btn {
      border: 0;
      background: #123a8c;
      color: white;
      padding: 14px 22px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secure-note {
      margin-top: 16px;
      font-size: 13px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="checkout-card">

      <div class="brand">
        GiftedGift Empire
      </div>

      <h1 class="checkout-title">
        Secure Checkout
      </h1>

      <div
        id="loading"
        class="loading"
      >
        Loading product...
      </div>

      <div
        id="checkout-content"
        style="display:none;"
      >

        <img
          id="product-image"
          class="product-image"
          alt="Product"
        />

        <div
          id="product-name"
          class="product-name"
        ></div>

        <div
          id="product-description"
          class="product-description"
        ></div>

        <div
          id="price-area"
          class="price-area"
        ></div>

        <div
          id="message"
          class="message"
        ></div>

        <div class="consent-box">

          <label>

            <input
              type="checkbox"
              id="withdrawal-consent"
            />

            <span>
              I expressly consent to the immediate delivery of this
              digital content and acknowledge that once the digital
              content is supplied, I lose my right of withdrawal where
              applicable.
            </span>

          </label>

        </div>

        <paypal-button
          id="paypal-button"
          type="pay"
        ></paypal-button>

        <div
          id="download-area"
          class="download-area"
        >

          <p>
            Payment completed successfully.
            Your secure download is ready.
          </p>

          <button
            id="download-button"
            class="download-btn"
            type="button"
          >
            Download Your Product
          </button>

        </div>

        <div class="secure-note">
          Secure digital checkout powered by PayPal.
        </div>

      </div>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://mvoxizdzjmtcvokowhpd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";

    const PAYPAL_SANDBOX_CLIENT_ID =
      "AQEwW30fuW09fPr4dtGUuWD0S3tlKblHPpZffcy0POvsuPhSI3b400ykmO893Fp4dO2yXtHR8Ey8nDGI";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      params.get(
        "product_id"
      );


    const dealId =
      params.get(
        "deal_id"
      );


    let currentProduct =
      null;

    let currentDeal =
      null;

    let checkoutAmount =
      null;

    let paypalSdkReady =
      false;

    let paypalConfigured =
      false;

    let paymentInProgress =
      false;

    let downloadToken =
      null;


    function showError(message) {

      const box =
        document.getElementById(
          "message"
        );

      box.className =
        "message error";

      box.textContent =
        message;
    }


    function showSuccess(message) {

      const box =
        document.getElementById(
          "message"
        );

      box.className =
        "message success";

      box.textContent =
        message;
    }


    function clearMessage() {

      const box =
        document.getElementById(
          "message"
        );

      box.className =
        "message";

      box.textContent =
        "";
    }


    function formatPrice(value) {

      return (
        "€" +
        Number(value).toFixed(2)
      );
    }


    function validNumber(value) {

      const number =
        Number(value);

      return (
        Number.isFinite(number) &&
        number > 0
      );
    }


    async function loadProduct() {

      const loading =
        document.getElementById(
          "loading"
        );

      const content =
        document.getElementById(
          "checkout-content"
        );


      try {

        const numericProductId =
          Number(productId);


        if (
          !Number.isInteger(
            numericProductId
          ) ||
          numericProductId <= 0
        ) {

          throw new Error(
            "This checkout link is missing a valid product."
          );
        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "digital_products"
            )
            .select(
              "id,name,description,price,image_url,product_type,active"
            )
            .eq(
              "id",
              numericProductId
            )
            .single();


        if (
          error ||
          !data
        ) {

          throw new Error(
            "This digital product could not be found."
          );
        }


        if (
          data.active !== true
        ) {

          throw new Error(
            "This digital product is not currently available."
          );
        }


        if (
          data.product_type !==
          "paid"
        ) {

          throw new Error(
            "This product does not require a paid checkout."
          );
        }


        if (
          !validNumber(
            data.price
          )
        ) {

          throw new Error(
            "This product does not have a valid price."
          );
        }


        currentProduct =
          data;

        checkoutAmount =
          Number(
            data.price
          );


        if (dealId) {

          await loadDeal();
        }


        renderProduct();


        loading.style.display =
          "none";

        content.style.display =
          "block";


        maybeConfigurePayPal();

      } catch (error) {

        loading.style.display =
          "none";

        content.style.display =
          "block";

        showError(
          error instanceof Error
            ? error.message
            : "Checkout could not be loaded."
        );


        const paypalButton =
          document.getElementById(
            "paypal-button"
          );

        if (paypalButton) {

          paypalButton.style.display =
            "none";
        }


        const consent =
          document.getElementById(
            "withdrawal-consent"
          );

        if (consent) {

          consent.disabled =
            true;
        }
      }
    }


    async function loadDeal() {

      const numericDealId =
        Number(dealId);


      if (
        !Number.isInteger(
          numericDealId
        ) ||
        numericDealId <= 0
      ) {

        throw new Error(
          "This deal link is invalid."
        );
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "deals"
          )
          .select(
            "id,item_type,item_id,deal_price,active,starts_at,ends_at"
          )
          .eq(
            "id",
            numericDealId
          )
          .single();


      if (
        error ||
        !data
      ) {

        throw new Error(
          "This deal could not be found."
        );
      }


      if (
        data.item_type !==
        "digital_product"
      ) {

        throw new Error(
          "This deal is not for a digital product."
        );
      }


      if (
        Number(
          data.item_id
        ) !==
        Number(
          currentProduct.id
        )
      ) {

        throw new Error(
          "This deal does not belong to this product."
        );
      }


      if (
        data.active !== true
      ) {

        throw new Error(
          "This deal is no longer active."
        );
      }


      const now =
        new Date();


      if (data.starts_at) {

        const startsAt =
          new Date(
            data.starts_at
          );


        if (
          Number.isNaN(
            startsAt.getTime()
          )
        ) {

          throw new Error(
            "This deal has an invalid start date."
          );
        }


        if (
          now <
          startsAt
        ) {

          throw new Error(
            "This deal has not started yet."
          );
        }
      }


      if (data.ends_at) {

        const endsAt =
          new Date(
            data.ends_at
          );


        if (
          Number.isNaN(
            endsAt.getTime()
          )
        ) {

          throw new Error(
            "This deal has an invalid end date."
          );
        }


        if (
          now >
          endsAt
        ) {

          throw new Error(
            "This deal has expired."
          );
        }
      }


      const dealPrice =
        Number(
          data.deal_price
        );


      const normalPrice =
        Number(
          currentProduct.price
        );


      if (
        !Number.isFinite(
          dealPrice
        ) ||
        dealPrice <= 0 ||
        dealPrice >=
          normalPrice
      ) {

        throw new Error(
          "This deal does not have a valid discounted price."
        );
      }


      currentDeal =
        data;

      checkoutAmount =
        dealPrice;
    }


    function renderProduct() {

      const image =
        document.getElementById(
          "product-image"
        );

      const name =
        document.getElementById(
          "product-name"
        );

      const description =
        document.getElementById(
          "product-description"
        );

      const priceArea =
        document.getElementById(
          "price-area"
        );


      if (
        currentProduct.image_url
      ) {

        image.src =
          currentProduct.image_url;

        image.style.display =
          "block";

      } else {

        image.style.display =
          "none";
      }


      name.textContent =
        currentProduct.name ||
        "Digital Product";


      description.textContent =
        currentProduct.description ||
        "";


      if (currentDeal) {

        const normalPrice =
          Number(
            currentProduct.price
          );

        const saving =
          normalPrice -
          Number(
            checkoutAmount
          );


        priceArea.innerHTML = `
          <div class="deal-price-row">
            <span class="old-price">
              ${formatPrice(normalPrice)}
            </span>

            <span class="deal-price">
              ${formatPrice(checkoutAmount)}
            </span>
          </div>

          <div class="deal-label">
            Deal applied — save ${formatPrice(saving)}
          </div>
        `;

      } else {

        priceArea.innerHTML = `
          <div class="normal-price">
            ${formatPrice(checkoutAmount)}
          </div>
        `;
      }
    }


    async function createPayPalOrder() {

      clearMessage();


      if (
        !currentProduct
      ) {

        throw new Error(
          "The product has not loaded yet."
        );
      }


      const consent =
        document.getElementById(
          "withdrawal-consent"
        );


      if (
        !consent.checked
      ) {

        showError(
          "Please accept the digital-content consent before paying."
        );

        throw new Error(
          "Digital-content consent is required."
        );
      }


      const requestBody = {

        product_id:
          Number(
            currentProduct.id
          ),

        withdrawal_waiver_accepted:
          true
      };


      if (currentDeal) {

        requestBody.deal_id =
          Number(
            currentDeal.id
          );
      }


      const response =
        await fetch(
          SUPABASE_URL +
            "/functions/v1/paypal-create-order",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                requestBody
              )
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.id
      ) {

        throw new Error(
          data.error ||
          "PayPal order could not be created."
        );
      }


      return {
        orderId:
          data.id
      };
    }


    async function capturePayPalOrder(
      orderId
    ) {

      const response =
        await fetch(
          SUPABASE_URL +
            "/functions/v1/paypal-capture-order",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                order_id:
                  orderId
              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        data.success !== true ||
        data.payment_status !==
          "COMPLETED" ||
        !data.download_token
      ) {

        throw new Error(
          data.error ||
          "Payment could not be confirmed."
        );
      }


      return data;
    }


    async function maybeConfigurePayPal() {

      if (
        paypalConfigured ||
        !paypalSdkReady ||
        !currentProduct
      ) {

        return;
      }


      paypalConfigured =
        true;


      try {

        const paypalInstance =
          await window.paypal
            .createInstance({
              clientId:
                PAYPAL_SANDBOX_CLIENT_ID,

              components: [
                "paypal-payments"
              ],

              pageType:
                "checkout"
            });


        const eligibility =
          await paypalInstance
            .findEligibleMethods({
              currencyCode:
                "EUR"
            });


        if (
          !eligibility ||
          !eligibility.isEligible(
            "paypal"
          )
        ) {

          throw new Error(
            "PayPal is not available for this checkout."
          );
        }


        const paypalSession =
          paypalInstance
            .createPayPalOneTimePaymentSession({
              onApprove:
                async (
                  data
                ) => {

                  try {

                    paymentInProgress =
                      true;

                    showSuccess(
                      "Payment approved. Confirming your order..."
                    );


                    const capture =
                      await capturePayPalOrder(
                        data.orderId
                      );


                    downloadToken =
                      capture.download_token;


                    document
                      .getElementById(
                        "paypal-button"
                      )
                      .style.display =
                      "none";


                    const consent =
                      document.getElementById(
                        "withdrawal-consent"
                      );


                    consent.disabled =
                      true;


                    document
                      .getElementById(
                        "download-area"
                      )
                      .style.display =
                      "block";


                    showSuccess(
                      "Payment completed successfully."
                    );

                  } catch (error) {

                    showError(
                      error instanceof Error
                        ? error.message
                        : "Payment confirmation failed."
                    );

                  } finally {

                    paymentInProgress =
                      false;
                  }
                },


              onCancel:
                () => {

                  paymentInProgress =
                    false;

                  showError(
                    "Payment was cancelled."
                  );
                },


              onError:
                (error) => {

                  console.error(
                    "PayPal error:",
                    error
                  );

                  paymentInProgress =
                    false;

                  showError(
                    "PayPal could not complete the payment."
                  );
                }
            });


        const paypalButton =
          document.getElementById(
            "paypal-button"
          );


        paypalButton
          .addEventListener(
            "click",
            async () => {

              if (
                paymentInProgress
              ) {

                return;
              }


              clearMessage();


              const consent =
                document.getElementById(
                  "withdrawal-consent"
                );


              if (
                !consent.checked
              ) {

                showError(
                  "Please accept the digital-content consent before paying."
                );

                return;
              }


              try {

                paymentInProgress =
                  true;


                /*
                  Important:
                  PayPal Web SDK v6 expects
                  the order promise to be
                  passed to session.start().
                  Do not await it here first.
                */

                const orderPromise =
                  createPayPalOrder();


                await paypalSession
                  .start(
                    {
                      presentationMode:
                        "auto"
                    },
                    orderPromise
                  );


              } catch (error) {

                console.error(
                  error
                );


                showError(
                  error instanceof Error
                    ? error.message
                    : "Unable to start PayPal checkout."
                );

              } finally {

                paymentInProgress =
                  false;
              }
            }
          );


      } catch (error) {

        console.error(
          error
        );


        paypalConfigured =
          false;


        showError(
          error instanceof Error
            ? error.message
            : "PayPal could not be loaded."
        );
      }
    }


    async function downloadProduct() {

      if (
        !downloadToken
      ) {

        showError(
          "Your secure download token is missing."
        );

        return;
      }


      const button =
        document.getElementById(
          "download-button"
        );


      button.disabled =
        true;

      button.textContent =
        "Preparing download...";


      try {

        const response =
          await fetch(
            SUPABASE_URL +
              "/functions/v1/digital-download",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  download_token:
                    downloadToken
                })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.download_url
        ) {

          throw new Error(
            data.error ||
            "The download could not be prepared."
          );
        }


        window.location.href =
          data.download_url;


      } catch (error) {

        showError(
          error instanceof Error
            ? error.message
            : "The download could not be prepared."
        );


        button.disabled =
          false;

        button.textContent =
          "Download Your Product";
      }
    }


    document
      .getElementById(
        "download-button"
      )
      .addEventListener(
        "click",
        downloadProduct
      );


    function onPayPalWebSdkLoaded() {

      paypalSdkReady =
        true;

      maybeConfigurePayPal();
    }


    window.onPayPalWebSdkLoaded =
      onPayPalWebSdkLoaded;


    loadProduct();

  </script>


  <script
    async
    src="https://www.sandbox.paypal.com/web-sdk/v6/core"
    onload="onPayPalWebSdkLoaded()"
  ></script>

</body>
</html>
