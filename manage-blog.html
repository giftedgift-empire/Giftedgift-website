<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Manage Blog | GiftedGift Empire</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      color: #f2bd16;
    }

    header p {
      margin: 0;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 22px;
      color: #123a8c;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 28px;
    }

    .card h2 {
      margin-top: 0;
      color: #123a8c;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      resize: vertical;
    }

    #excerpt {
      min-height: 110px;
    }

    #content {
      min-height: 280px;
      line-height: 1.6;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .image-preview {
      display: none;
      margin-top: 15px;
      max-width: 300px;
    }

    .image-preview img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f7f7f7;
    }

    .publish-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
    }

    .publish-row input {
      width: 20px;
      height: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button {
      background: #f2bd16;
      color: #111;
    }

    .cancel-button {
      display: none;
      background: #ddd;
      color: #222;
    }

    .message {
      display: none;
      padding: 13px;
      margin-bottom: 20px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #e8f7ec;
      color: #17652d;
      border: 1px solid #b8dfc0;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #951d1d;
      border: 1px solid #efbbbb;
    }

    .posts-grid {
      display: grid;
      gap: 20px;
    }

    .post-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      background: #fff;
    }

    .post-image {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 9px;
      background: #f6f6f6;
      margin-bottom: 15px;
    }

    .post-card h3 {
      margin: 0 0 10px;
      color: #123a8c;
      font-size: 23px;
    }

    .post-card p {
      color: #555;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin: 7px 0 12px;
    }

    .published {
      background: #e7f6eb;
      color: #21753a;
    }

    .draft {
      background: #fff1cc;
      color: #795600;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .edit-button {
      background: #f2bd16;
      color: #111;
      margin-right: 8px;
    }

    .delete-button {
      background: #eee;
      color: #a12626;
    }

    .empty {
      color: #666;
      text-align: center;
      padding: 30px 10px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .card {
        padding: 20px;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }

  </style>
</head>


<body>

<div id="loading">
  Checking admin access...
</div>


<div
  id="admin-page"
  style="display:none;"
>

<header>

  <h1>
    Manage Blog
  </h1>

  <p>
    Create and manage GiftedGift Empire articles.
  </p>

</header>


<main class="page">

  <a
    href="dashboard.html"
    class="back-link"
  >
    ← Back to Dashboard
  </a>


  <div
    id="message"
    class="message"
  ></div>


  <section class="card">

    <h2 id="form-title">
      Add Blog Post
    </h2>


    <div class="field">

      <label for="title">
        Article Title
      </label>

      <input
        id="title"
        type="text"
        placeholder="Example: 10 Useful Home Products Worth Buying"
      >

    </div>


    <div class="field">

      <label for="excerpt">
        Short Excerpt
      </label>

      <textarea
        id="excerpt"
        placeholder="Write a short introduction that will appear on the Blog page..."
      ></textarea>

    </div>


    <div class="field">

      <label for="content">
        Full Article
      </label>

      <textarea
        id="content"
        placeholder="Write the complete article here..."
      ></textarea>

    </div>


    <div class="field">

      <label for="image-file">
        Article Cover Image
      </label>

      <input
        id="image-file"
        type="file"
        accept="image/*"
      >

      <div
        id="image-preview"
        class="image-preview"
      >

        <img
          id="preview-image"
          alt="Blog image preview"
        >

      </div>

    </div>


    <div class="publish-row">

      <input
        id="published"
        type="checkbox"
      >

      <label
        for="published"
        style="margin:0;"
      >
        Publish this article now
      </label>

    </div>


    <div class="actions">

      <button
        id="save-button"
        class="save-button"
        type="button"
      >
        Save Blog Post
      </button>


      <button
        id="cancel-button"
        class="cancel-button"
        type="button"
      >
        Cancel Editing
      </button>

    </div>

  </section>


  <section class="card">

    <h2>
      Existing Blog Posts
    </h2>

    <div
      id="posts"
      class="posts-grid"
    >
      Loading posts...
    </div>

  </section>

</main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
></script>


<script>

const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const ADMIN_USER_ID =
  "57a302e5-9a38-443b-8568-cc32c5a91bdf";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let editingId =
  null;


let existingImageUrl =
  "";


const titleInput =
  document.getElementById(
    "title"
  );


const excerptInput =
  document.getElementById(
    "excerpt"
  );


const contentInput =
  document.getElementById(
    "content"
  );


const imageFileInput =
  document.getElementById(
    "image-file"
  );


const publishedInput =
  document.getElementById(
    "published"
  );


function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value ?? "";


  return div.innerHTML;
}


function showMessage(
  text,
  type = "success"
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    `message ${type}`;


  box.textContent =
    text;


  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


function clearMessage() {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message";


  box.textContent =
    "";
}


function showPreview(
  url
) {

  const wrapper =
    document.getElementById(
      "image-preview"
    );


  const image =
    document.getElementById(
      "preview-image"
    );


  if (
    url
  ) {

    image.src =
      url;


    wrapper.style.display =
      "block";

  } else {

    image.removeAttribute(
      "src"
    );


    wrapper.style.display =
      "none";
  }
}


function resetForm() {

  editingId =
    null;


  existingImageUrl =
    "";


  titleInput.value =
    "";


  excerptInput.value =
    "";


  contentInput.value =
    "";


  imageFileInput.value =
    "";


  publishedInput.checked =
    false;


  showPreview(
    ""
  );


  document.getElementById(
    "form-title"
  ).textContent =
    "Add Blog Post";


  document.getElementById(
    "save-button"
  ).textContent =
    "Save Blog Post";


  document.getElementById(
    "cancel-button"
  ).style.display =
    "none";
}


function safeFileName(
  name
) {

  return String(
    name || "blog-image"
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9._-]+/g,
      "-"
    );
}


async function uploadBlogImage(
  file
) {

  if (
    !file
  ) {

    return existingImageUrl || null;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    throw new Error(
      "Please choose an image file."
    );
  }


  const path =
    "blog/" +
    Date.now() +
    "-" +
    safeFileName(
      file.name
    );


  const {
    error
  } =
    await db
      .storage
      .from(
        "product-images"
      )
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


  if (
    error
  ) {

    console.error(
      error
    );


    throw new Error(
      "The blog image could not be uploaded."
    );
  }


  const {
    data
  } =
    db
      .storage
      .from(
        "product-images"
      )
      .getPublicUrl(
        path
      );


  return (
    data?.publicUrl ||
    null
  );
}


async function savePost() {

  clearMessage();


  const title =
    titleInput.value.trim();


  const excerpt =
    excerptInput.value.trim();


  const content =
    contentInput.value.trim();


  if (
    !title
  ) {

    showMessage(
      "Please enter an article title.",
      "error"
    );

    titleInput.focus();

    return;
  }


  if (
    !excerpt
  ) {

    showMessage(
      "Please enter a short excerpt.",
      "error"
    );

    excerptInput.focus();

    return;
  }


  if (
    !content
  ) {

    showMessage(
      "Please write the article content.",
      "error"
    );

    contentInput.focus();

    return;
  }


  const saveButton =
    document.getElementById(
      "save-button"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Saving...";


  try {

    const file =
      imageFileInput.files?.[0] ||
      null;


    const imageUrl =
      await uploadBlogImage(
        file
      );


    const payload = {

      title,

      excerpt,

      content,

      image_url:
        imageUrl,

      published:
        publishedInput.checked

    };


    let error;


    if (
      editingId
    ) {

      const result =
        await db
          .from(
            "blog_posts"
          )
          .update(
            payload
          )
          .eq(
            "id",
            editingId
          );


      error =
        result.error;

    } else {

      const result =
        await db
          .from(
            "blog_posts"
          )
          .insert(
            payload
          );


      error =
        result.error;
    }


    if (
      error
    ) {

      console.error(
        error
      );


      throw new Error(
        error.message ||
        "The blog post could not be saved."
      );
    }


    showMessage(
      editingId
        ? "Blog post updated successfully."
        : "Blog post created successfully."
    );


    resetForm();


    await loadPosts();


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      error instanceof Error
        ? error.message
        : "The blog post could not be saved.",
      "error"
    );


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      editingId
        ? "Update Blog Post"
        : "Save Blog Post";
  }
}


async function loadPosts() {

  const box =
    document.getElementById(
      "posts"
    );


  box.innerHTML =
    "Loading posts...";


  const {
    data,
    error
  } =
    await db
      .from(
        "blog_posts"
      )
      .select(
        "id,title,excerpt,content,image_url,published,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (
    error
  ) {

    console.error(
      error
    );


    box.innerHTML = `
      <div class="empty">
        Blog posts could not be loaded.
      </div>
    `;


    return;
  }


  const posts =
    Array.isArray(
      data
    )
      ? data
      : [];


  if (
    posts.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        No blog posts have been created yet.
      </div>
    `;


    return;
  }


  box.innerHTML =
    "";


  posts.forEach(
    post => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "post-card";


      const date =
        post.created_at

          ? new Date(
              post.created_at
            ).toLocaleString()

          : "";


      card.innerHTML = `

        ${
          post.image_url

            ? `
              <img
                class="post-image"
                src="${escapeHTML(
                  post.image_url
                )}"
                alt="${escapeHTML(
                  post.title
                )}"
              >
            `

            : ""
        }


        <h3>
          ${escapeHTML(
            post.title
          )}
        </h3>


        <span
          class="status ${
            post.published
              ? "published"
              : "draft"
          }"
        >
          ${
            post.published
              ? "Published"
              : "Draft"
          }
        </span>


        ${
          date

            ? `
              <div class="date">
                ${escapeHTML(
                  date
                )}
              </div>
            `

            : ""
        }


        <p>
          ${escapeHTML(
            post.excerpt || ""
          )}
        </p>


        <button
          class="edit-button"
          type="button"
          data-edit-id="${post.id}"
        >
          Edit
        </button>


        <button
          class="delete-button"
          type="button"
          data-delete-id="${post.id}"
        >
          Delete
        </button>

      `;


      card
        .querySelector(
          "[data-edit-id]"
        )
        .addEventListener(
          "click",
          () => {

            startEditing(
              post
            );
          }
        );


      card
        .querySelector(
          "[data-delete-id]"
        )
        .addEventListener(
          "click",
          () => {

            deletePost(
              post.id,
              post.title
            );
          }
        );


      box.appendChild(
        card
      );
    }
  );
}


function startEditing(
  post
) {

  editingId =
    post.id;


  existingImageUrl =
    post.image_url ||
    "";


  titleInput.value =
    post.title ||
    "";


  excerptInput.value =
    post.excerpt ||
    "";


  contentInput.value =
    post.content ||
    "";


  publishedInput.checked =
    post.published === true;


  imageFileInput.value =
    "";


  showPreview(
    existingImageUrl
  );


  document.getElementById(
    "form-title"
  ).textContent =
    "Edit Blog Post";


  document.getElementById(
    "save-button"
  ).textContent =
    "Update Blog Post";


  document.getElementById(
    "cancel-button"
  ).style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


async function deletePost(
  id,
  title
) {

  const confirmed =
    confirm(
      `Delete "${title}"?`
    );


  if (
    !confirmed
  ) {

    return;
  }


  const {
    error
  } =
    await db
      .from(
        "blog_posts"
      )
      .delete()
      .eq(
        "id",
        id
      );


  if (
    error
  ) {

    console.error(
      error
    );


    showMessage(
      error.message ||
      "The blog post could not be deleted.",
      "error"
    );


    return;
  }


  showMessage(
    "Blog post deleted successfully."
  );


  if (
    editingId === id
  ) {

    resetForm();
  }


  await loadPosts();
}


async function protectPage() {

  const {
    data,
    error
  } =
    await db
      .auth
      .getSession();


  const session =
    data?.session;


  if (
    error ||
    !session ||
    session.user?.id !==
      ADMIN_USER_ID
  ) {

    window.location.replace(
      "admin.html"
    );


    return;
  }


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "admin-page"
  ).style.display =
    "block";


  await loadPosts();
}


imageFileInput
  .addEventListener(
    "change",
    () => {

      const file =
        imageFileInput
          .files?.[0];


      if (
        !file
      ) {

        showPreview(
          existingImageUrl
        );

        return;
      }


      const temporaryUrl =
        URL.createObjectURL(
          file
        );


      showPreview(
        temporaryUrl
      );
    }
  );


document.getElementById(
  "save-button"
).addEventListener(
  "click",
  savePost
);


document.getElementById(
  "cancel-button"
).addEventListener(
  "click",
  resetForm
);


protectPage();

</script>

</body>

</html>
