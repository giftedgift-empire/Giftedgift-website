<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | GiftedGift Empire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #123a8c;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #f2bd16;
      color: #111;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>GiftedGift Empire</h1>

  <p class="subtitle">
    Admin Login
  </p>

  <form id="login-form">

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your admin email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Sign In
    </button>

  </form>

  <p id="message" class="message"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL =
    "https://mvoxizdzjmtcvokowhpd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("login-form");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "Signing in...";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent =
        "Login failed. Please check your email and password.";

      return;
    }

    message.textContent =
      "Login successful.";

    window.location.href = "dashboard.html";
  });
</script>

</body>
</html>
