<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Manage Support Tickets | GiftedGift Empire
  </title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #222;
    }

    .top-bar {
      background: #123a8c;
      color: white;
      padding: 20px;
    }

    .top-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    .top-bar h1 {
      margin: 0;
      color: #f2bd16;
      font-size: 27px;
    }

    .top-bar p {
      margin: 7px 0 0;
    }

    .page {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 24px 15px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #123a8c;
      font-weight: 700;
      text-decoration: none;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0,1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border: 1px solid #dfe4ec;
      border-radius: 13px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 800;
      color: #123a8c;
    }

    .stat-label {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
    }

    .tools {
      background: white;
      border: 1px solid #dfe4ec;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns:
        minmax(0,1fr)
        180px
        180px
        auto;
      gap: 10px;
    }

    input,
    select,
    textarea,
    button {
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      padding: 10px 11px;
      background: white;
    }

    input,
    select {
      min-height: 42px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary-btn {
      background: #123a8c;
      color: white;
    }

    .secondary-btn {
      background: #edf2ff;
      color: #123a8c;
      border: 1px solid #c9d5ed;
    }

    .note-btn {
      background: #f2bd16;
      color: #222;
      width: 100%;
      margin-top: 8px;
    }

    .tickets {
      display: grid;
      gap: 16px;
    }

    .ticket-card {
      background: white;
      border: 1px solid #dfe4ec;
      border-radius: 15px;
      overflow: hidden;
    }

    .ticket-header {
      padding: 16px;
      border-bottom: 1px solid #edf0f5;
    }

    .ticket-header-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .ticket-number {
      font-family: monospace;
      font-weight: 800;
      color: #123a8c;
      font-size: 15px;
    }

    .ticket-subject {
      margin: 7px 0 0;
      font-size: 20px;
      color: #222;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-new {
      background: #e9f2ff;
      color: #175cd3;
    }

    .status-in_progress {
      background: #fff4e5;
      color: #b54708;
    }

    .status-resolved {
      background: #ecfdf3;
      color: #067647;
    }

    .status-closed {
      background: #eee;
      color: #555;
    }

    .priority-low {
      background: #f4f4f5;
      color: #555;
    }

    .priority-normal {
      background: #edf2ff;
      color: #123a8c;
    }

    .priority-high {
      background: #fff1e8;
      color: #b54708;
    }

    .priority-urgent {
      background: #fef3f2;
      color: #b42318;
    }

    .ticket-body {
      padding: 16px;
    }

    .details-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .detail {
      background: #f8f9fc;
      border: 1px solid #eceff4;
      border-radius: 9px;
      padding: 11px;
    }

    .detail-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #777;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .detail-value {
      word-break: break-word;
      line-height: 1.5;
    }

    .message-box {
      background: #fbfcfe;
      border: 1px solid #dde3ec;
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .actions {
      display: grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr)
        auto;
      gap: 10px;
      align-items: end;
      padding-top: 15px;
      border-top: 1px solid #edf0f5;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #555;
    }

    .reply-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #123a8c;
      color: white;
      border-radius: 8px;
      min-height: 42px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .notes-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #edf0f5;
    }

    .notes-section h3 {
      margin: 0 0 10px;
      color: #123a8c;
      font-size: 16px;
    }

    .note-item {
      border-left: 4px solid #f2bd16;
      background: #fffaf0;
      border-radius: 7px;
      padding: 10px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .note-date {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
    }

    .empty {
      background: white;
      border: 1px solid #dfe4ec;
      border-radius: 13px;
      padding: 30px 18px;
      text-align: center;
      color: #666;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      border: 1px solid #fecdca;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      border: 1px solid #abefc6;
      color: #067647;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #666;
    }

    @media (
      max-width: 800px
    ) {

      .stats {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header class="top-bar">

  <div class="top-inner">

    <h1>
      GiftedGift Empire
    </h1>

    <p>
      Admin Support Inbox
    </p>

  </div>

</header>


<main class="page">


  <a
    href="dashboard.html"
    class="back-link"
  >
    ← Back to Admin Dashboard
  </a>


  <div
    id="page-message"
    class="message"
  ></div>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <div
        id="stat-total"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Total
      </div>

    </div>


    <div class="stat">

      <div
        id="stat-new"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        New
      </div>

    </div>


    <div class="stat">

      <div
        id="stat-progress"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        In Progress
      </div>

    </div>


    <div class="stat">

      <div
        id="stat-resolved"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Resolved
      </div>

    </div>


    <div class="stat">

      <div
        id="stat-closed"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Closed
      </div>

    </div>

  </section>


  <!-- SEARCH / FILTERS -->

  <section class="tools">

    <input
      type="search"
      id="search-input"
      placeholder="Search ticket number, name, email, subject, message or reference"
      oninput="renderTickets()"
    >


    <select
      id="status-filter"
      onchange="renderTickets()"
    >

      <option value="">
        All statuses
      </option>

      <option value="new">
        New
      </option>

      <option value="in_progress">
        In Progress
      </option>

      <option value="resolved">
        Resolved
      </option>

      <option value="closed">
        Closed
      </option>

    </select>


    <select
      id="category-filter"
      onchange="renderTickets()"
    >

      <option value="">
        All categories
      </option>

      <option value="order">
        Order
      </option>

      <option value="payment">
        Payment
      </option>

      <option value="delivery_shipping">
        Delivery / Shipping
      </option>

      <option value="refund_return">
        Refund / Return
      </option>

      <option value="digital_download">
        Digital Download
      </option>

      <option value="account_login">
        Account / Login
      </option>

      <option value="creator_support">
        Creator / Seller Support
      </option>

      <option value="affiliate_support">
        Affiliate Support
      </option>

      <option value="other">
        Something Else
      </option>

    </select>


    <button
      type="button"
      class="secondary-btn"
      onclick="loadSupportData()"
    >
      Refresh
    </button>

  </section>


  <div
    id="ticket-list"
    class="tickets"
  >

    <div class="loading">
      Loading support tickets...
    </div>

  </div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
></script>


<script>

  /*
  =====================================================
  SUPABASE
  =====================================================
  */

  const SUPABASE_URL =
    "https://mvoxizdzjmtcvokowhpd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let tickets =
    [];


  let notes =
    [];


  /*
  =====================================================
  SECURITY
  =====================================================
  */

  async function checkAdmin() {

    const {
      data: sessionData
    } =
      await supabaseClient
        .auth
        .getSession();


    const session =
      sessionData.session;


    if (
      !session
    ) {

      window.location.href =
        "admin.html";

      return false;

    }


    const {
      data: isAdmin,
      error
    } =
      await supabaseClient
        .rpc(
          "is_site_admin"
        );


    if (
      error ||
      isAdmin !== true
    ) {

      showPageMessage(
        "Admin authorization required.",
        "error"
      );

      return false;

    }


    return true;

  }


  /*
  =====================================================
  PAGE MESSAGE
  =====================================================
  */

  function showPageMessage(
    text,
    type
  ) {

    const box =
      document.getElementById(
        "page-message"
      );


    box.className =
      "message " + type;

    box.textContent =
      text;


    if (
      type === "success"
    ) {

      setTimeout(
        () => {

          box.className =
            "message";

          box.textContent =
            "";

        },
        3500
      );

    }

  }


  /*
  =====================================================
  ESCAPE USER CONTENT
  =====================================================
  */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /*
  =====================================================
  CATEGORY LABEL
  =====================================================
  */

  function categoryLabel(
    category
  ) {

    const labels = {

      order:
        "Order",

      payment:
        "Payment",

      delivery_shipping:
        "Delivery / Shipping",

      refund_return:
        "Refund / Return",

      digital_download:
        "Digital Download",

      account_login:
        "Account / Login",

      creator_support:
        "Creator / Seller Support",

      affiliate_support:
        "Affiliate Support",

      other:
        "Something Else"

    };


    return labels[
      category
    ] || category;

  }


  /*
  =====================================================
  STATUS LABEL
  =====================================================
  */

  function statusLabel(
    status
  ) {

    const labels = {

      new:
        "New",

      in_progress:
        "In Progress",

      resolved:
        "Resolved",

      closed:
        "Closed"

    };


    return labels[
      status
    ] || status;

  }


  /*
  =====================================================
  DATE
  =====================================================
  */

  function formatDate(
    value
  ) {

    if (
      !value
    ) {

      return "—";

    }


    return new Date(
      value
    ).toLocaleString(
      undefined,
      {
        dateStyle:
          "medium",

        timeStyle:
          "short"
      }
    );

  }


  /*
  =====================================================
  LOAD SUPPORT DATA
  =====================================================
  */

  async function loadSupportData() {

    const ticketList =
      document.getElementById(
        "ticket-list"
      );


    ticketList.innerHTML =
      '<div class="loading">Loading support tickets...</div>';


    const {
      data: ticketData,
      error: ticketError
    } =
      await supabaseClient
        .from(
          "support_tickets"
        )
        .select(
          "*"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (
      ticketError
    ) {

      console.error(
        ticketError
      );


      ticketList.innerHTML =
        '<div class="empty">Could not load support tickets.</div>';

      return;

    }


    tickets =
      ticketData || [];


    const {
      data: noteData,
      error: noteError
    } =
      await supabaseClient
        .from(
          "support_ticket_notes"
        )
        .select(
          "*"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (
      noteError
    ) {

      console.error(
        noteError
      );

      notes =
        [];

    }

    else {

      notes =
        noteData || [];

    }


    updateStats();

    renderTickets();

  }


  /*
  =====================================================
  STATS
  =====================================================
  */

  function updateStats() {

    document
      .getElementById(
        "stat-total"
      )
      .textContent =
        tickets.length;


    document
      .getElementById(
        "stat-new"
      )
      .textContent =
        tickets.filter(
          ticket =>
            ticket.status ===
            "new"
        ).length;


    document
      .getElementById(
        "stat-progress"
      )
      .textContent =
        tickets.filter(
          ticket =>
            ticket.status ===
            "in_progress"
        ).length;


    document
      .getElementById(
        "stat-resolved"
      )
      .textContent =
        tickets.filter(
          ticket =>
            ticket.status ===
            "resolved"
        ).length;


    document
      .getElementById(
        "stat-closed"
      )
      .textContent =
        tickets.filter(
          ticket =>
            ticket.status ===
            "closed"
        ).length;

  }


  /*
  =====================================================
  RENDER TICKETS
  =====================================================
  */

  function renderTickets() {

    const list =
      document.getElementById(
        "ticket-list"
      );


    const search =
      document
        .getElementById(
          "search-input"
        )
        .value
        .trim()
        .toLowerCase();


    const statusFilter =
      document
        .getElementById(
          "status-filter"
        )
        .value;


    const categoryFilter =
      document
        .getElementById(
          "category-filter"
        )
        .value;


    const filtered =
      tickets.filter(
        ticket => {

          if (
            statusFilter &&
            ticket.status !==
              statusFilter
          ) {

            return false;

          }


          if (
            categoryFilter &&
            ticket.category !==
              categoryFilter
          ) {

            return false;

          }


          if (
            search
          ) {

            const haystack = [

              ticket.ticket_number,
              ticket.requester_name,
              ticket.requester_email,
              ticket.order_reference,
              ticket.category,
              ticket.subject,
              ticket.message

            ]
              .join(
                " "
              )
              .toLowerCase();


            if (
              !haystack.includes(
                search
              )
            ) {

              return false;

            }

          }


          return true;

        }
      );


    if (
      filtered.length === 0
    ) {

      list.innerHTML =
        '<div class="empty">No support tickets match this view.</div>';

      return;

    }


    list.innerHTML =
      filtered
        .map(
          ticket =>
            buildTicketCard(
              ticket
            )
        )
        .join(
          ""
        );

  }


  /*
  =====================================================
  BUILD CARD
  =====================================================
  */

  function buildTicketCard(
    ticket
  ) {

    const ticketNotes =
      notes.filter(
        note =>
          note.ticket_id ===
          ticket.id
      );


    const notesHtml =
      ticketNotes.length
        ? ticketNotes
            .map(
              note => `
                <div class="note-item">

                  <div>
                    ${escapeHtml(note.note)}
                  </div>

                  <div class="note-date">
                    ${escapeHtml(formatDate(note.created_at))}
                  </div>

                </div>
              `
            )
            .join(
              ""
            )

        : `
            <div class="small-note">
              No private Admin notes yet.
            </div>
          `;


    const mailSubject =
      encodeURIComponent(
        "GiftedGift Empire Support - " +
        ticket.ticket_number
      );


    return `

      <article class="ticket-card">

        <div class="ticket-header">

          <div class="ticket-header-top">

            <div>

              <div class="ticket-number">
                ${escapeHtml(ticket.ticket_number)}
              </div>

              <h2 class="ticket-subject">
                ${escapeHtml(ticket.subject)}
              </h2>

            </div>


            <div class="badges">

              <span
                class="badge status-${escapeHtml(ticket.status)}"
              >
                ${escapeHtml(statusLabel(ticket.status))}
              </span>

              <span
                class="badge priority-${escapeHtml(ticket.priority)}"
              >
                ${escapeHtml(ticket.priority)}
              </span>

            </div>

          </div>

        </div>


        <div class="ticket-body">


          <div class="details-grid">


            <div class="detail">

              <div class="detail-label">
                Customer
              </div>

              <div class="detail-value">
                ${escapeHtml(ticket.requester_name)}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Email
              </div>

              <div class="detail-value">
                ${escapeHtml(ticket.requester_email)}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Category
              </div>

              <div class="detail-value">
                ${escapeHtml(categoryLabel(ticket.category))}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Order / Reference
              </div>

              <div class="detail-value">
                ${escapeHtml(ticket.order_reference || "—")}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Created
              </div>

              <div class="detail-value">
                ${escapeHtml(formatDate(ticket.created_at))}
              </div>

            </div>


            <div class="detail">

              <div class="detail-label">
                Last Activity
              </div>

              <div class="detail-value">
                ${escapeHtml(formatDate(ticket.last_activity_at))}
              </div>

            </div>


          </div>


          <div class="detail-label">
            Customer Message
          </div>


          <div class="message-box">${escapeHtml(ticket.message)}</div>


          <!-- STATUS / PRIORITY -->

          <div class="actions">


            <div>

              <label
                class="field-label"
                for="status-${ticket.id}"
              >
                Status
              </label>

              <select
                id="status-${ticket.id}"
              >

                <option
                  value="new"
                  ${ticket.status === "new" ? "selected" : ""}
                >
                  New
                </option>

                <option
                  value="in_progress"
                  ${ticket.status === "in_progress" ? "selected" : ""}
                >
                  In Progress
                </option>

                <option
                  value="resolved"
                  ${ticket.status === "resolved" ? "selected" : ""}
                >
                  Resolved
                </option>

                <option
                  value="closed"
                  ${ticket.status === "closed" ? "selected" : ""}
                >
                  Closed
                </option>

              </select>

            </div>


            <div>

              <label
                class="field-label"
                for="priority-${ticket.id}"
              >
                Priority
              </label>

              <select
                id="priority-${ticket.id}"
              >

                <option
                  value="low"
                  ${ticket.priority === "low" ? "selected" : ""}
                >
                  Low
                </option>

                <option
                  value="normal"
                  ${ticket.priority === "normal" ? "selected" : ""}
                >
                  Normal
                </option>

                <option
                  value="high"
                  ${ticket.priority === "high" ? "selected" : ""}
                >
                  High
                </option>

                <option
                  value="urgent"
                  ${ticket.priority === "urgent" ? "selected" : ""}
                >
                  Urgent
                </option>

              </select>

            </div>


            <button
              type="button"
              class="primary-btn"
              onclick="saveTicket('${ticket.id}')"
            >
              Save
            </button>


          </div>


          <!-- CONTACT CUSTOMER -->

          <div style="margin-top:12px;">

            <a
              class="reply-link"
              href="mailto:${encodeURIComponent(ticket.requester_email)}?subject=${mailSubject}"
            >
              Reply by Email
            </a>

          </div>


          <!-- PRIVATE NOTES -->

          <div class="notes-section">

            <h3>
              Private Admin Notes
            </h3>


            <div>
              ${notesHtml}
            </div>


            <textarea
              id="note-${ticket.id}"
              maxlength="5000"
              placeholder="Add a private Admin note. Customers cannot see this."
            ></textarea>


            <button
              type="button"
              class="note-btn"
              onclick="addNote('${ticket.id}')"
            >
              Add Private Note
            </button>

          </div>


        </div>

      </article>

    `;

  }


  /*
  =====================================================
  SAVE STATUS / PRIORITY
  =====================================================
  */

  async function saveTicket(
    ticketId
  ) {

    const status =
      document
        .getElementById(
          "status-" +
          ticketId
        )
        .value;


    const priority =
      document
        .getElementById(
          "priority-" +
          ticketId
        )
        .value;


    const {
      error
    } =
      await supabaseClient
        .rpc(
          "admin_update_support_ticket",
          {

            p_ticket_id:
              ticketId,

            p_status:
              status,

            p_priority:
              priority

          }
        );


    if (
      error
    ) {

      console.error(
        error
      );


      showPageMessage(
        error.message ||
        "Could not update ticket.",
        "error"
      );

      return;

    }


    showPageMessage(
      "Support ticket updated successfully.",
      "success"
    );


    await loadSupportData();

  }


  /*
  =====================================================
  ADD PRIVATE NOTE
  =====================================================
  */

  async function addNote(
    ticketId
  ) {

    const input =
      document.getElementById(
        "note-" +
        ticketId
      );


    const note =
      input.value.trim();


    if (
      note.length < 2
    ) {

      showPageMessage(
        "Please enter an Admin note.",
        "error"
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .rpc(
          "admin_add_support_note",
          {

            p_ticket_id:
              ticketId,

            p_note:
              note

          }
        );


    if (
      error
    ) {

      console.error(
        error
      );


      showPageMessage(
        error.message ||
        "Could not add Admin note.",
        "error"
      );

      return;

    }


    showPageMessage(
      "Private Admin note added.",
      "success"
    );


    await loadSupportData();

  }


  /*
  =====================================================
  START
  =====================================================
  */

  async function startPage() {

    const allowed =
      await checkAdmin();


    if (
      !allowed
    ) {

      return;

    }


    await loadSupportData();

  }


  startPage();

</script>


</body>

</html>
