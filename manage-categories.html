<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Categories | GiftedGift Empire</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #123a8c;
  color: white;
  padding: 22px 20px;
}

header h1 {
  margin: 0 0 5px;
  color: #f2bd16;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px 18px;
}

.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #123a8c;
  text-decoration: none;
  font-weight: bold;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

.panel h2 {
  margin-top: 0;
  color: #123a8c;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  margin-top: 18px;
  background: #f2bd16;
  color: #111;
  border: none;
  padding: 12px 18px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.cancel-button {
  background: #ddd;
  display: none;
}

.delete-button {
  background: #ddd;
  margin-left: 8px;
}

.category-item {
  padding: 18px 0;
  border-bottom: 1px solid #ddd;
}

.category-item:last-child {
  border-bottom: none;
}

.category-item h3 {
  margin: 0 0 8px;
  color: #123a8c;
}

.category-item p {
  margin: 5px 0;
  color: #555;
  line-height: 1.5;
}

.slug {
  font-size: 13px;
  color: #777;
}

.message {
  margin-top: 15px;
  font-weight: bold;
}

#status {
  text-align: center;
  padding: 50px 20px;
  font-weight: bold;
}

</style>
</head>


<body>

<div id="status">
  Checking admin login...
</div>


<div id="page" style="display:none;">

<header>
  <h1>GiftedGift Empire</h1>
  <p>Manage Categories</p>
</header>


<main class="container">

<a href="dashboard.html" class="back-link">
  ← Back to Dashboard
</a>


<div class="panel">

<h2 id="form-title">
  Add Category
</h2>

<form id="category-form">

<input
  type="hidden"
  id="category-id"
>


<label for="name">
  Category Name
</label>

<input
  type="text"
  id="name"
  placeholder="Example: Home & Living"
  required
>


<label for="description">
  Description
</label>

<textarea
  id="description"
  placeholder="Describe this category..."
></textarea>


<label for="image_url">
  Category Image URL
</label>

<input
  type="url"
  id="image_url"
  placeholder="https://..."
>


<label for="slug">
  Category Slug
</label>

<input
  type="text"
  id="slug"
  placeholder="Example: home-living"
>

<p style="font-size:14px;color:#666;">
  If you leave the slug empty, it will be created automatically from the category name.
</p>


<button
  type="submit"
  id="save-button"
>
  Save Category
</button>


<button
  type="button"
  id="cancel-edit"
  class="cancel-button"
>
  Cancel Edit
</button>


<p
  id="form-message"
  class="message"
></p>

</form>

</div>



<div class="panel">

<h2>
  Existing Categories
</h2>

<div id="category-list">
  Loading categories...
</div>

</div>

</main>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>

const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



async function protectPage() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (
    error ||
    !data.session
  ) {

    window.location.replace(
      "admin.html"
    );

    return;
  }


  document
    .getElementById("status")
    .style.display = "none";


  document
    .getElementById("page")
    .style.display = "block";


  loadCategories();
}



async function loadCategories() {

  const list =
    document.getElementById(
      "category-list"
    );


  list.textContent =
    "Loading categories...";


  const {
    data: categories,
    error
  } =
    await supabaseClient
      .from("categories")
      .select("*")
      .order(
        "created_at",
        { ascending: false }
      );


  if (error) {

    console.error(error);

    list.textContent =
      "Categories could not be loaded.";

    return;
  }


  if (
    !categories ||
    categories.length === 0
  ) {

    list.textContent =
      "No categories have been added yet.";

    return;
  }


  list.innerHTML = "";


  categories.forEach(
    category => {

      const item =
        document.createElement("div");


      item.className =
        "category-item";


      item.innerHTML = `

        <h3>
          ${escapeHTML(
            category.name || "Category"
          )}
        </h3>


        <p>
          ${escapeHTML(
            category.description || ""
          )}
        </p>


        <p class="slug">
          Slug:
          ${escapeHTML(
            category.slug || ""
          )}
        </p>


        <button
          type="button"
          onclick="editCategory(${category.id})"
        >
          Edit
        </button>


        <button
          type="button"
          class="delete-button"
          onclick="deleteCategory(${category.id})"
        >
          Delete
        </button>

      `;


      list.appendChild(item);
    }
  );
}



document
  .getElementById(
    "category-form"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const message =
        document.getElementById(
          "form-message"
        );


      message.textContent =
        "Saving...";


      const id =
        document.getElementById(
          "category-id"
        ).value;


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      let slug =
        document.getElementById(
          "slug"
        ).value.trim();


      if (!slug) {
        slug = createSlug(name);
      }


      const categoryData = {

        name: name,

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim(),

        image_url:
          document
            .getElementById(
              "image_url"
            )
            .value
            .trim()
          || null,

        slug: slug

      };


      let error;


      if (id) {

        const result =
          await supabaseClient
            .from("categories")
            .update(
              categoryData
            )
            .eq(
              "id",
              id
            );


        error =
          result.error;

      } else {

        const result =
          await supabaseClient
            .from("categories")
            .insert(
              categoryData
            );


        error =
          result.error;
      }


      if (error) {

        console.error(error);

        message.textContent =
          "Category could not be saved.";

        return;
      }


      message.textContent =
        id
          ? "Category updated successfully."
          : "Category added successfully.";


      resetForm();

      loadCategories();

    }
  );



async function editCategory(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("categories")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "Category could not be opened."
    );

    return;
  }


  document
    .getElementById(
      "category-id"
    )
    .value =
      data.id;


  document
    .getElementById(
      "name"
    )
    .value =
      data.name || "";


  document
    .getElementById(
      "description"
    )
    .value =
      data.description || "";


  document
    .getElementById(
      "image_url"
    )
    .value =
      data.image_url || "";


  document
    .getElementById(
      "slug"
    )
    .value =
      data.slug || "";


  document
    .getElementById(
      "form-title"
    )
    .textContent =
      "Edit Category";


  document
    .getElementById(
      "save-button"
    )
    .textContent =
      "Update Category";


  document
    .getElementById(
      "cancel-edit"
    )
    .style.display =
      "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}



async function deleteCategory(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this category?"
    );


  if (!confirmed) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("categories")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    alert(
      "Category could not be deleted."
    );

    return;
  }


  loadCategories();
}



document
  .getElementById(
    "cancel-edit"
  )
  .addEventListener(
    "click",
    resetForm
  );



function resetForm() {

  document
    .getElementById(
      "category-form"
    )
    .reset();


  document
    .getElementById(
      "category-id"
    )
    .value = "";


  document
    .getElementById(
      "form-title"
    )
    .textContent =
      "Add Category";


  document
    .getElementById(
      "save-button"
    )
    .textContent =
      "Save Category";


  document
    .getElementById(
      "cancel-edit"
    )
    .style.display =
      "none";
}



function createSlug(value) {

  return value
    .toLowerCase()
    .trim()
    .replace(
      /&/g,
      "and"
    )
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      ""
    );
}



function escapeHTML(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value == null
      ? ""
      : String(value);


  return div.innerHTML;
}



protectPage();

</script>

</body>
  </html>
