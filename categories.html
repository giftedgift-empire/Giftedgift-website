<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Categories | GiftedGift Empire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 25px 20px;
    }

    header h1 {
      color: #f2bd16;
      margin: 0 0 20px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #f2bd16;
    }

    .hero {
      text-align: center;
      background: white;
      padding: 50px 20px 35px;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #555;
      max-width: 650px;
      margin: auto;
      line-height: 1.7;
    }

    .categories {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .category-card {
      background: white;
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .category-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .category-card h3 {
      font-size: 24px;
      margin-top: 0;
      color: #123a8c;
    }

    .category-card p {
      color: #555;
      line-height: 1.6;
    }

    .category-card a {
      display: inline-block;
      margin-top: 12px;
      background: #f2bd16;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      padding: 11px 18px;
      border-radius: 7px;
    }

    .loading-message {
      text-align: center;
      grid-column: 1 / -1;
      font-weight: bold;
      color: #555;
      padding: 30px;
    }

    footer {
      margin-top: 40px;
      background: #123a8c;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>GiftedGift Empire</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="categories.html">Categories</a>
    <a href="blog.html">Blog</a>
    <a href="deals.html">Deals</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">🛒 Cart</a>
  </nav>
</header>

<section class="hero">
  <h2>Shop by Category</h2>

  <p>
    Browse products by category and discover useful items,
    digital products, lifestyle finds and recommendations.
  </p>
</section>

<main class="categories">

  <div id="category-grid" class="category-grid">
    <div class="loading-message">
      Loading categories...
    </div>
  </div>

</main>

<footer>
  <p><strong>GiftedGift Empire</strong></p>
  <p>© 2026 GiftedGift Empire. All rights reserved.</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>

const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";

/* PASTE YOUR sb_publishable_ KEY BETWEEN THE QUOTES BELOW */

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function loadCategories() {

  const grid =
    document.getElementById("category-grid");

  const { data: categories, error } =
    await supabaseClient
      .from("categories")
      .select("*")
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "Error loading categories:",
      error
    );

    grid.innerHTML = `
      <div class="loading-message">
        Categories could not be loaded.
      </div>
    `;

    return;
  }


  if (!categories || categories.length === 0) {

    grid.innerHTML = `
      <div class="loading-message">
        No categories are available yet.
      </div>
    `;

    return;
  }


  grid.innerHTML = "";


  categories.forEach(category => {

    const card =
      document.createElement("div");

    card.className = "category-card";


    const categoryName =
      category.name || "Category";


    const description =
      category.description || "";


    const shopLink =
      "shop.html?category=" +
      encodeURIComponent(categoryName);


    let imageHTML = "";

    if (category.image_url) {

      imageHTML = `
        <img
          src="${escapeHTML(category.image_url)}"
          alt="${escapeHTML(categoryName)}"
        >
      `;
    }


    card.innerHTML = `
      ${imageHTML}

      <h3>
        ${escapeHTML(categoryName)}
      </h3>

      <p>
        ${escapeHTML(description)}
      </p>

      <a href="${shopLink}">
        Shop Now
      </a>
    `;


    grid.appendChild(card);

  });

}


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}


loadCategories();

</script>

</body>
</html>
