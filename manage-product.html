<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | GiftedGift Empire</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #123a8c;
  color: white;
  padding: 22px 20px;
}

header h1 {
  margin: 0 0 5px;
  color: #f2bd16;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px 18px;
}

.top-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #123a8c;
  text-decoration: none;
  font-weight: bold;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

.panel h2 {
  color: #123a8c;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

input[type="file"] {
  background: #f7f7f7;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.image-help {
  color: #666;
  font-size: 14px;
  margin-top: 7px;
}

.image-preview {
  display: none;
  margin-top: 15px;
}

.image-preview img {
  width: 100%;
  max-width: 320px;
  height: 240px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
}

.checkbox-row input {
  width: auto;
}

.checkbox-row label {
  margin: 0;
}

button {
  margin-top: 20px;
  background: #f2bd16;
  color: #111;
  border: none;
  padding: 13px 18px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.product-item {
  border-bottom: 1px solid #ddd;
  padding: 18px 0;
}

.product-item:last-child {
  border-bottom: none;
}

.product-item img {
  width: 140px;
  height: 110px;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid #ddd;
  margin-bottom: 12px;
}

.product-item h3 {
  margin: 0 0 8px;
  color: #123a8c;
}

.small {
  color: #666;
  font-size: 14px;
}

.actions button {
  margin-right: 8px;
  margin-top: 10px;
}

.delete-btn {
  background: #ddd;
}

.message {
  margin-top: 15px;
  font-weight: bold;
}

#status {
  text-align: center;
  padding: 50px 20px;
  font-weight: bold;
}

</style>
</head>


<body>

<div id="status">
  Checking admin login...
</div>


<div id="page" style="display:none;">

<header>
  <h1>GiftedGift Empire</h1>
  <p>Manage Products</p>
</header>


<main class="container">

<a href="dashboard.html" class="top-link">
  ← Back to Dashboard
</a>


<div class="panel">

<h2 id="form-title">
  Add Product
</h2>


<form id="product-form">

<input
  type="hidden"
  id="product-id"
>

<input
  type="hidden"
  id="current-image-url"
>


<label for="name">
  Product Name
</label>

<input
  type="text"
  id="name"
  required
>
  <label for="slug">
  Share Link Name
</label>

<input
  type="text"
  id="slug"
  placeholder="wireless-bluetooth-speaker"
  required
>

<p class="image-help">
  Public product link:
  https://giftedgiftempire.com/<strong id="slug-preview">product-name</strong>
</p>


<label for="description">
  Description
</label>

<textarea
  id="description"
  placeholder="Describe this product..."
></textarea>


<label for="price">
  Price (€)
</label>

<input
  type="number"
  id="price"
  step="0.01"
  min="0"
>


<label for="category">
  Category
</label>

<select
  id="category"
  required
>
  <option value="">
    Loading categories...
  </option>
</select>


<label for="product-image">
  Product Image
</label>

<input
  type="file"
  id="product-image"
  accept="image/*"
>

<p class="image-help">
  Tap Choose File to select a product image from your phone.
</p>


<div
  id="image-preview"
  class="image-preview"
>
  <img
    id="preview-img"
    alt="Product image preview"
  >
</div>


<label for="product_url">
  Product / Buy Link
</label>

<input
  type="url"
  id="product_url"
  placeholder="https://..."
>


<label for="rating">
  Rating
</label>

<input
  type="number"
  id="rating"
  step="0.1"
  min="0"
  max="5"
  placeholder="Example: 4.5"
>


<div class="checkbox-row">

  <input
    type="checkbox"
    id="featured"
  >

  <label for="featured">
    Featured Product
  </label>

</div>


<div class="checkbox-row">

  <input
    type="checkbox"
    id="in_stock"
    checked
  >

  <label for="in_stock">
    In Stock
  </label>

</div>


<button
  type="submit"
  id="save-button"
>
  Save Product
</button>


<button
  type="button"
  id="cancel-edit"
  style="display:none; background:#ddd;"
>
  Cancel Edit
</button>


<p
  id="form-message"
  class="message"
></p>

</form>

</div>


<div class="panel">

<h2>
  Existing Products
</h2>

<div id="product-list">
  Loading products...
</div>

</div>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>

const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const STORAGE_BUCKET =
  "product-images";


const ADMIN_USER_ID =
  "57a302e5-9a38-443b-8568-cc32c5a91bdf";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



async function protectPage() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session ||
    !data.session.user ||
    data.session.user.id !== ADMIN_USER_ID
  ) {

    window.location.replace(
      "admin.html"
    );

    return;
  }


  document
    .getElementById("status")
    .style.display =
      "none";


  document
    .getElementById("page")
    .style.display =
      "block";


  await loadCategoryOptions();

  await loadProducts();

}



async function loadCategoryOptions() {

  const select =
    document.getElementById(
      "category"
    );


  select.innerHTML =
    `<option value="">Select category</option>`;


  const {
    data: categories,
    error
  } =
    await supabaseClient
      .from("categories")
      .select("name")
      .order(
        "name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Category loading error:",
      error
    );


    select.innerHTML =
      `<option value="">Categories could not be loaded</option>`;

    return;
  }


  if (
    !categories ||
    categories.length === 0
  ) {

    select.innerHTML =
      `<option value="">No categories available</option>`;

    return;
  }


  categories.forEach(
    category => {

      if (!category.name) {
        return;
      }


      const option =
        document.createElement(
          "option"
        );


      option.value =
        category.name;


      option.textContent =
        category.name;


      select.appendChild(
        option
      );

    }
  );

}

let slugWasEdited =
  false;


function cleanSlug(value) {

  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/×/g, "x")
    .replace(/&/g, " and ")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

}


function suggestShortSlug(value) {

  const fullSlug =
    cleanSlug(value);

  if (!fullSlug) {
    return "";
  }

  return fullSlug
    .split("-")
    .slice(0, 4)
    .join("-");

}


function updateSlugPreview() {

  const slug =
    cleanSlug(
      document
        .getElementById(
          "slug"
        )
        .value
    );


  document
    .getElementById(
      "slug-preview"
    )
    .textContent =
      slug ||
      "product-name";

}


document
  .getElementById(
    "name"
  )
  .addEventListener(
    "input",
    function() {

      if (slugWasEdited) {
        return;
      }


      document
        .getElementById(
          "slug"
        )
        .value =
          suggestShortSlug(
            this.value
          );


      updateSlugPreview();

    }
  );


document
  .getElementById(
    "slug"
  )
  .addEventListener(
    "input",
    function() {

      slugWasEdited =
        true;


      this.value =
        cleanSlug(
          this.value
        );


      updateSlugPreview();

    }
  );

document
  .getElementById(
    "product-image"
  )
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      if (
        !file.type ||
        !file.type.startsWith("image/")
      ) {

        alert(
          "Please choose an image file."
        );

        event.target.value =
          "";

        return;
      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        alert(
          "Please choose an image smaller than 5 MB."
        );

        event.target.value =
          "";

        return;
      }


      const temporaryURL =
        URL.createObjectURL(
          file
        );


      showImagePreview(
        temporaryURL
      );

    }
  );



function showImagePreview(url) {

  const preview =
    document.getElementById(
      "image-preview"
    );


  const image =
    document.getElementById(
      "preview-img"
    );


  if (!url) {

    preview.style.display =
      "none";

    image.removeAttribute(
      "src"
    );

    return;
  }


  image.src =
    url;


  preview.style.display =
    "block";

}



async function uploadProductImage(file) {

  if (!file) {
    return null;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session ||
    !data.session.user ||
    data.session.user.id !== ADMIN_USER_ID
  ) {

    throw new Error(
      "Admin login could not be verified."
    );

  }


  const originalName =
    file.name ||
    "product.jpg";


  const parts =
    originalName.split(".");


  let extension =
    parts.length > 1
      ? parts.pop()
      : "jpg";


  extension =
    extension
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ""
      );


  if (!extension) {
    extension = "jpg";
  }


  let safeName =
    parts
      .join("-")
      .toLowerCase()
      .replace(
        /[^a-z0-9_-]+/g,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        ""
      );


  if (!safeName) {
    safeName = "product";
  }


  const randomPart =
    Math.random()
      .toString(36)
      .slice(2, 10);


  const filePath =
    "products/" +
    Date.now() +
    "-" +
    randomPart +
    "-" +
    safeName +
    "." +
    extension;


  const {
    data: uploadData,
    error: uploadError
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        filePath,
        file,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            file.type ||
            undefined
        }
      );


  if (uploadError) {

    console.error(
      "Image upload error:",
      uploadError
    );

    throw uploadError;
  }


  const uploadedPath =
    uploadData &&
    uploadData.path
      ? uploadData.path
      : filePath;


  const {
    data: publicURLData
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        uploadedPath
      );


  if (
    !publicURLData ||
    !publicURLData.publicUrl
  ) {

    throw new Error(
      "Image uploaded but its public URL could not be created."
    );

  }


  return publicURLData.publicUrl;

}



async function loadProducts() {

  const list =
    document.getElementById(
      "product-list"
    );


  list.textContent =
    "Loading products...";


  const {
    data: products,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );


    list.textContent =
      "Products could not be loaded.";

    return;
  }


  if (
    !products ||
    products.length === 0
  ) {

    list.textContent =
      "No products have been added yet.";

    return;
  }


  list.innerHTML =
    "";


  products.forEach(
    product => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "product-item";


      let imageHTML =
        "";


      if (
        product.image_url
      ) {

        imageHTML = `
          <img
            src="${escapeAttribute(product.image_url)}"
            alt="${escapeAttribute(product.name || "Product")}"
          >
        `;

      }


      const priceHTML =
        product.price !== null &&
        product.price !== undefined
          ? "€" +
            Number(
              product.price
            ).toFixed(2)
          : "No price";


      const ratingHTML =
        product.rating !== null &&
        product.rating !== undefined
          ? "Rating: " +
            Number(
              product.rating
            ).toFixed(1) +
            " / 5"
          : "No rating";


      item.innerHTML = `

        ${imageHTML}

        <h3>
          ${escapeHTML(
            product.name ||
            "Product"
          )}
        </h3>


        <p class="small">
          ${escapeHTML(
            product.category ||
            ""
          )}
        </p>


        <p>
          ${escapeHTML(
            priceHTML
          )}
        </p>


        <p class="small">
          ${escapeHTML(
            ratingHTML
          )}
        </p>


        <div class="actions">

          <button
            type="button"
            onclick="editProduct(${product.id})"
          >
            Edit
          </button>


          <button
            type="button"
            class="delete-btn"
            onclick="deleteProduct(${product.id})"
          >
            Delete
          </button>

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );

}



document
  .getElementById(
    "product-form"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const message =
        document.getElementById(
          "form-message"
        );


      const saveButton =
        document.getElementById(
          "save-button"
        );


      saveButton.disabled =
        true;


      message.textContent =
        "Saving...";


      try {

        const id =
          document.getElementById(
            "product-id"
          ).value;


        let imageURL =
          document.getElementById(
            "current-image-url"
          ).value ||
          null;


        const imageInput =
          document.getElementById(
            "product-image"
          );


        const selectedFile =
          imageInput.files &&
          imageInput.files.length > 0
            ? imageInput.files[0]
            : null;


        if (selectedFile) {

          message.textContent =
            "Uploading product image...";


          imageURL =
            await uploadProductImage(
              selectedFile
            );


          message.textContent =
            "Saving product...";

        }


        const productData = {

          name:
            document
              .getElementById(
                "name"
              )
              .value
              .trim(),
          slug:
  cleanSlug(
    document
      .getElementById(
        "slug"
      )
      .value
  ),

          description:
            document
              .getElementById(
                "description"
              )
              .value
              .trim(),

          price:
            document
              .getElementById(
                "price"
              )
              .value
              ? Number(
                  document
                    .getElementById(
                      "price"
                    )
                    .value
                )
              : null,

          category:
            document
              .getElementById(
                "category"
              )
              .value,

          image_url:
            imageURL,

          product_url:
            document
              .getElementById(
                "product_url"
              )
              .value
              .trim()
            || null,

          rating:
            document
              .getElementById(
                "rating"
              )
              .value
              ? Number(
                  document
                    .getElementById(
                      "rating"
                    )
                    .value
                )
              : null,

          featured:
            document
              .getElementById(
                "featured"
              )
              .checked,

          in_stock:
            document
              .getElementById(
                "in_stock"
              )
              .checked

        };


        let productError;


        if (id) {

          const result =
            await supabaseClient
              .from("products")
              .update(
                productData
              )
              .eq(
                "id",
                id
              );


          productError =
            result.error;

        } else {

          const result =
            await supabaseClient
              .from("products")
              .insert(
                productData
              );


          productError =
            result.error;

        }


        if (productError) {

          console.error(
            productError
          );

          throw productError;
        }


        message.textContent =
          id
            ? "Product updated successfully."
            : "Product added successfully.";


        resetForm();


        await loadProducts();

      } catch (error) {

        console.error(
          error
        );


        message.textContent =
          "Product could not be saved. Please check your login, image and product details.";

      } finally {

        saveButton.disabled =
          false;

      }

    }
  );



async function editProduct(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (
    error ||
    !data
  ) {

    alert(
      "Product could not be opened."
    );

    return;
  }


  document
    .getElementById(
      "product-id"
    )
    .value =
      data.id;


  document
    .getElementById(
      "name"
    )
    .value =
      data.name ||
      "";
  document
  .getElementById(
    "slug"
  )
  .value =
    data.slug ||
    suggestShortSlug(
      data.name
    );


slugWasEdited =
  true;


updateSlugPreview();


  document
    .getElementById(
      "description"
    )
    .value =
      data.description ||
      "";


  document
    .getElementById(
      "price"
    )
    .value =
      data.price ??
      "";


  ensureCategoryOption(
    data.category ||
    ""
  );


  document
    .getElementById(
      "category"
    )
    .value =
      data.category ||
      "";


  document
    .getElementById(
      "current-image-url"
    )
    .value =
      data.image_url ||
      "";


  document
    .getElementById(
      "product-image"
    )
    .value =
      "";


  showImagePreview(
    data.image_url ||
    ""
  );


  document
    .getElementById(
      "product_url"
    )
    .value =
      data.product_url ||
      "";


  document
    .getElementById(
      "rating"
    )
    .value =
      data.rating ??
      "";


  document
    .getElementById(
      "featured"
    )
    .checked =
      Boolean(
        data.featured
      );


  document
    .getElementById(
      "in_stock"
    )
    .checked =
      Boolean(
        data.in_stock
      );


  document
    .getElementById(
      "form-title"
    )
    .textContent =
      "Edit Product";


  document
    .getElementById(
      "save-button"
    )
    .textContent =
      "Update Product";


  document
    .getElementById(
      "cancel-edit"
    )
    .style.display =
      "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



function ensureCategoryOption(
  categoryName
) {

  if (!categoryName) {
    return;
  }


  const select =
    document.getElementById(
      "category"
    );


  const exists =
    Array
      .from(
        select.options
      )
      .some(
        option =>
          option.value ===
          categoryName
      );


  if (!exists) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      categoryName;


    option.textContent =
      categoryName +
      " (existing product category)";


    select.appendChild(
      option
    );

  }

}



async function deleteProduct(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this product?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      error
    );


    alert(
      "Product could not be deleted."
    );

    return;
  }


  loadProducts();

}



document
  .getElementById(
    "cancel-edit"
  )
  .addEventListener(
    "click",
    resetForm
  );



function resetForm() {

  document
    .getElementById("product-form")
    .reset();
  
  slugWasEdited =
    false;

  updateSlugPreview();

  document
    .getElementById("product-id")
    .value = "";

  document
    .getElementById("current-image-url")
    .value = "";

  document
    .getElementById("in_stock")
    .checked = true;

  showImagePreview("");

  document
    .getElementById("form-title")
    .textContent = "Add Product";

  document
    .getElementById("save-button")
    .textContent = "Save Product";

  document
    .getElementById("cancel-edit")
    .style.display = "none";
}


function escapeHTML(value) {

  return String(
    value == null ? "" : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return escapeHTML(value);

}


protectPage();

</script>
