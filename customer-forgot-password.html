<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Forgot Password | GiftedGift Empire
  </title>

  <meta
    name="description"
    content="Reset your GiftedGift Empire customer account password securely."
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          180deg,
          #eef4ff 0%,
          #f8f9fc 55%,
          #ffffff 100%
        );
      color: #222;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow:
        0 10px 35px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      color: #123a8c;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 25px;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd3df;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #123a8c;
      box-shadow:
        0 0 0 3px rgba(18,58,140,0.08);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #123a8c;
      color: #fff;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 18px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      border: 1px solid #efb4b4;
      color: #941c1c;
    }

    .message.success {
      display: block;
      background: #e9f8ed;
      border: 1px solid #b8e3c2;
      color: #17662d;
    }

    .message.info {
      display: block;
      background: #eef5ff;
      border: 1px solid #c8d9f5;
      color: #123a8c;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      line-height: 1.8;
    }

    .links a {
      color: #123a8c;
      font-weight: 700;
      text-decoration: none;
    }

    .security-note {
      margin-top: 20px;
      background: #fff8dc;
      border: 1px solid #e6c85c;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      color: #555;
    }

  </style>
</head>


<body>

<div class="page">

  <div class="card">

    <div class="brand">
      GiftedGift Empire
    </div>

    <h1>
      Forgot Your Password?
    </h1>

    <p class="intro">
      Enter the email address connected to your
      customer account. We will send you a secure
      password-reset link.
    </p>


    <form id="forgot-form">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="Enter your email address"
        required
      >


      <button
        type="submit"
        id="submit-button"
      >
        Send Reset Link
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="security-note">
      🔒 For privacy and security, we do not confirm
      whether a particular email address has an account.
    </div>


    <div class="links">

      <a href="/customer-login.html">
        ← Back to Customer Login
      </a>

      <br>

      <a href="/shop">
        Continue Shopping
      </a>

    </div>

  </div>

</div>


<script>


const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message " +
    type;


  box.textContent =
    text;
}


document
  .getElementById(
    "forgot-form"
  )
  .addEventListener(
    "submit",
    async function (
      event
    ) {

      event.preventDefault();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const button =
        document.getElementById(
          "submit-button"
        );


      if (
        !email
      ) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      button.disabled =
        true;


      button.textContent =
        "Sending Reset Link...";


      showMessage(
        "Preparing your secure password-reset email...",
        "info"
      );


      try {


        const redirectUrl =
          window.location.origin +
          "/customer-reset-password.html";


        const {
          error
        } =
          await supabaseClient
            .auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  redirectUrl,
              }
            );


        if (
          error
        ) {

          console.error(
            error
          );


          if (
            String(
              error.message ||
              ""
            )
              .toLowerCase()
              .includes(
                "rate limit"
              )
          ) {

            throw new Error(
              "Too many reset emails were requested. Please wait a little and try again."
            );
          }


          throw new Error(
            "The password-reset email could not be sent right now. Please try again."
          );
        }


        showMessage(
          "If an account exists for that email address, a secure password-reset link has been sent. Please check your inbox and spam folder.",
          "success"
        );


        document
          .getElementById(
            "forgot-form"
          )
          .reset();


      } catch (
        error
      ) {


        showMessage(
          error instanceof Error
            ? error.message
            : "Something went wrong. Please try again.",
          "error"
        );

      } finally {


        button.disabled =
          false;


        button.textContent =
          "Send Reset Link";

      }

    }
  );


</script>


<script
  src="cookie-consent.js"
></script>


</body>

</html>
