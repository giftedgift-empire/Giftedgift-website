<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Page Not Found | GiftedGift Empire
  </title>

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#123a8c"
  >

  <link
    rel="icon"
    type="image/png"
    href="/my-logo.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #eef4ff 0%,
          #ffffff 65%
        );

      color: #222;

      display: flex;
      flex-direction: column;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;
      color: white;

      font-size: 24px;
      font-weight: 800;
    }

    .brand img {
      width: 48px;
      height: 48px;

      object-fit: contain;

      background: white;

      border-radius: 50%;

      padding: 3px;
    }

    .brand span {
      color: #f2bd16;
    }

    main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 18px;
    }

    .card {
      width: 100%;
      max-width: 650px;

      text-align: center;

      background: white;

      border:
        1px solid #dfe5ef;

      border-radius: 20px;

      padding:
        45px
        25px;

      box-shadow:
        0
        12px
        35px
        rgba(18,58,140,0.08);
    }

    .error-code {
      font-size: 80px;
      font-weight: 900;

      color: #123a8c;

      line-height: 1;
    }

    h1 {
      margin:
        16px
        0
        10px;

      color: #123a8c;
    }

    p {
      color: #666;

      line-height: 1.7;

      max-width: 500px;

      margin:
        0
        auto
        28px;
    }

    .buttons {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;
    }

    .button {
      display: inline-block;

      padding:
        13px
        19px;

      border-radius: 9px;

      text-decoration: none;

      font-weight: 800;
    }

    .primary {
      background: #123a8c;
      color: white;
    }

    .secondary {
      background: #f2bd16;
      color: #111;
    }

    footer {
      background: #123a8c;

      color: white;

      text-align: center;

      padding:
        22px
        16px;

      font-size: 14px;
    }

    footer a {
      color: #f2bd16;
      text-decoration: none;
      font-weight: 700;
    }

  </style>

</head>


<body>

<header>

  <div class="header-inner">

    <a
      href="/"
      class="brand"
    >

      <img
        src="/my-logo.png"
        alt="GiftedGift Empire"
      >

      GiftedGift
      <span>Empire</span>

    </a>

  </div>

</header>


<main>

  <section class="card">

    <div class="error-code">
      404
    </div>

    <h1>
      Oops! This Page Could Not Be Found
    </h1>

    <p>

      The page you are looking for may have been moved,
      renamed or no longer exists.

      <br><br>

      You can return to GiftedGift Empire
      or continue shopping.

    </p>

    <div class="buttons">

      <a
        href="/"
        class="button primary"
      >
        Back to Home
      </a>

      <a
        href="/shop"
        class="button secondary"
      >
        Visit Shop
      </a>

    </div>

  </section>

</main>


<footer>

  © GiftedGift Empire

  <br><br>

  <a href="/customer-service">
    Customer Service
  </a>

</footer>
<script
  src="/cookie-consent.js"
  defer
></script>

<script
  src="/tracking.js"
  defer
></script>
</body>

</html>
