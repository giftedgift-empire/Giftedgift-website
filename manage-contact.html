<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Manage Contact | GiftedGift Empire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      color: #f2bd16;
    }

    header p {
      margin: 0;
    }

    .page {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 22px;
      color: #123a8c;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #123a8c;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f7f7f7;
    }

    .help {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 7px;
    }

    .preview {
      display: none;
      margin-top: 15px;
    }

    .preview img {
      width: 100%;
      max-width: 420px;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f7f7f7;
    }

    .save-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #f2bd16;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #e8f7ec;
      border: 1px solid #b8dfc0;
      color: #17652d;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      border: 1px solid #efbbbb;
      color: #951d1d;
    }

    #loading {
      text-align: center;
      padding: 50px 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>


<body>

<div id="loading">
  Checking admin access...
</div>


<div
  id="admin-page"
  style="display:none;"
>

<header>

  <h1>
    Manage Contact
  </h1>

  <p>
    Edit the public GiftedGift Empire Contact page.
  </p>

</header>


<main class="page">

  <a
    href="dashboard.html"
    class="back-link"
  >
    ← Back to Dashboard
  </a>


  <div
    id="message"
    class="message"
  ></div>


  <section class="card">

    <h2>
      Contact Page Content
    </h2>


    <div class="field">

      <label for="title">
        Page Title
      </label>

      <input
        id="title"
        type="text"
        placeholder="Contact Us"
      >

    </div>


    <div class="field">

      <label for="subtitle">
        Subtitle
      </label>

      <input
        id="subtitle"
        type="text"
        placeholder="Questions, suggestions, partnerships or business enquiries?"
      >

    </div>


    <div class="field">

      <label for="content">
        Contact Message
      </label>

      <textarea
        id="content"
        placeholder="Write the message visitors should see on your Contact page..."
      ></textarea>

    </div>


    <div class="field">

      <label for="email">
        Contact Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="gift@giftedgiftempire.com"
      >

      <div class="help">
        Visitors will see this email and the contact button will open their email app.
      </div>

    </div>


    <div class="field">

      <label for="button-text">
        Email Button Text
      </label>

      <input
        id="button-text"
        type="text"
        placeholder="Email GiftedGift Empire"
      >

    </div>


    <div class="field">

      <label for="image-file">
        Contact Image (optional)
      </label>

      <input
        id="image-file"
        type="file"
        accept="image/*"
      >

      <div
        id="preview"
        class="preview"
      >

        <img
          id="preview-image"
          alt="Contact page image preview"
        >

      </div>

    </div>


    <button
      id="save-button"
      class="save-button"
      type="button"
    >
      Save Contact Page
    </button>

  </section>

</main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
></script>


<script>

const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const ADMIN_USER_ID =
  "57a302e5-9a38-443b-8568-cc32c5a91bdf";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentRowId =
  null;


let currentImageUrl =
  "";


const titleInput =
  document.getElementById(
    "title"
  );


const subtitleInput =
  document.getElementById(
    "subtitle"
  );


const contentInput =
  document.getElementById(
    "content"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const buttonTextInput =
  document.getElementById(
    "button-text"
  );


const imageFileInput =
  document.getElementById(
    "image-file"
  );


function showMessage(
  text,
  type = "success"
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    `message ${type}`;


  box.textContent =
    text;


  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


function showPreview(
  url
) {

  const wrapper =
    document.getElementById(
      "preview"
    );


  const image =
    document.getElementById(
      "preview-image"
    );


  if (
    url
  ) {

    image.src =
      url;


    wrapper.style.display =
      "block";

  } else {

    image.removeAttribute(
      "src"
    );


    wrapper.style.display =
      "none";
  }
}


function safeFileName(
  name
) {

  return String(
    name || "contact-image"
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9._-]+/g,
      "-"
    );
}


function emailFromButtonUrl(
  value
) {

  const url =
    String(
      value || ""
    ).trim();


  if (
    url.toLowerCase().startsWith(
      "mailto:"
    )
  ) {

    return url.substring(
      7
    );
  }


  return "";
}


async function uploadImage(
  file
) {

  if (
    !file
  ) {

    return currentImageUrl || null;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    throw new Error(
      "Please choose an image file."
    );
  }


  const path =
    "site-content/contact-" +
    Date.now() +
    "-" +
    safeFileName(
      file.name
    );


  const {
    error
  } =
    await db
      .storage
      .from(
        "product-images"
      )
      .upload(
        path,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );


  if (
    error
  ) {

    console.error(
      error
    );


    throw new Error(
      "The Contact image could not be uploaded."
    );
  }


  const {
    data
  } =
    db
      .storage
      .from(
        "product-images"
      )
      .getPublicUrl(
        path
      );


  return (
    data?.publicUrl ||
    null
  );
}


async function loadContact() {

  const {
    data,
    error
  } =
    await db
      .from(
        "site_content"
      )
      .select(
        "id,section,title,subtitle,content,button_text,button_url,image_url,updated_at"
      )
      .eq(
        "section",
        "contact"
      )
      .limit(1)
      .maybeSingle();


  if (
    error
  ) {

    console.error(
      error
    );


    showMessage(
      "The Contact page information could not be loaded.",
      "error"
    );


    return;
  }


  if (
    !data
  ) {

    titleInput.value =
      "Contact Us";


    subtitleInput.value =
      "Questions, suggestions, partnerships or business enquiries?";


    contentInput.value =
      "We’d love to hear from you. For business enquiries, partnerships, product questions or general support, contact GiftedGift Empire by email.";


    emailInput.value =
      "gift@giftedgiftempire.com";


    buttonTextInput.value =
      "Email GiftedGift Empire";


    return;
  }


  currentRowId =
    data.id;


  currentImageUrl =
    data.image_url ||
    "";


  titleInput.value =
    data.title ||
    "";


  subtitleInput.value =
    data.subtitle ||
    "";


  contentInput.value =
    data.content ||
    "";


  emailInput.value =
    emailFromButtonUrl(
      data.button_url
    );


  buttonTextInput.value =
    data.button_text ||
    "";


  showPreview(
    currentImageUrl
  );
}


async function saveContact() {

  const title =
    titleInput.value.trim();


  const subtitle =
    subtitleInput.value.trim();


  const content =
    contentInput.value.trim();


  const email =
    emailInput.value.trim();


  const buttonText =
    buttonTextInput.value.trim();


  if (
    !title
  ) {

    showMessage(
      "Please enter the Contact page title.",
      "error"
    );

    titleInput.focus();

    return;
  }


  if (
    !subtitle
  ) {

    showMessage(
      "Please enter the Contact page subtitle.",
      "error"
    );

    subtitleInput.focus();

    return;
  }


  if (
    !content
  ) {

    showMessage(
      "Please enter the Contact message.",
      "error"
    );

    contentInput.focus();

    return;
  }


  if (
    !email ||
    !emailInput.checkValidity()
  ) {

    showMessage(
      "Please enter a valid contact email address.",
      "error"
    );

    emailInput.focus();

    return;
  }


  if (
    !buttonText
  ) {

    showMessage(
      "Please enter the email button text.",
      "error"
    );

    buttonTextInput.focus();

    return;
  }


  const button =
    document.getElementById(
      "save-button"
    );


  button.disabled =
    true;


  button.textContent =
    "Saving...";


  try {

    const file =
      imageFileInput.files?.[0] ||
      null;


    const imageUrl =
      await uploadImage(
        file
      );


    const payload = {

      section:
        "contact",

      title,

      subtitle,

      content,

      button_text:
        buttonText,

      button_url:
        "mailto:" + email,

      image_url:
        imageUrl,

      updated_at:
        new Date().toISOString()

    };


    let result;


    if (
      currentRowId
    ) {

      result =
        await db
          .from(
            "site_content"
          )
          .update(
            payload
          )
          .eq(
            "id",
            currentRowId
          )
          .select()
          .single();

    } else {

      result =
        await db
          .from(
            "site_content"
          )
          .insert(
            payload
          )
          .select()
          .single();
    }


    if (
      result.error
    ) {

      console.error(
        result.error
      );


      throw new Error(
        result.error.message ||
        "The Contact page could not be saved."
      );
    }


    currentRowId =
      result.data.id;


    currentImageUrl =
      result.data.image_url ||
      "";


    imageFileInput.value =
      "";


    showPreview(
      currentImageUrl
    );


    showMessage(
      "Contact page saved successfully."
    );


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      error instanceof Error
        ? error.message
        : "The Contact page could not be saved.",
      "error"
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "Save Contact Page";
  }
}


async function protectPage() {

  const {
    data,
    error
  } =
    await db
      .auth
      .getSession();


  const session =
    data?.session;


  if (
    error ||
    !session ||
    session.user?.id !==
      ADMIN_USER_ID
  ) {

    window.location.replace(
      "admin.html"
    );


    return;
  }


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "admin-page"
  ).style.display =
    "block";


  await loadContact();
}


imageFileInput
  .addEventListener(
    "change",
    () => {

      const file =
        imageFileInput.files?.[0];


      if (
        !file
      ) {

        showPreview(
          currentImageUrl
        );

        return;
      }


      const temporaryUrl =
        URL.createObjectURL(
          file
        );


      showPreview(
        temporaryUrl
      );
    }
  );


document.getElementById(
  "save-button"
).addEventListener(
  "click",
  saveContact
);


protectPage();

</script>

</body>

</html>
