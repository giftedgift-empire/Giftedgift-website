<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>About | GiftedGift Empire</title>

  <meta
    name="description"
    content="Learn more about GiftedGift Empire, our mission and how we help people discover useful products, digital resources and recommendations."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #123a8c;
      color: white;
      padding: 25px 20px;
    }

    header h1 {
      margin: 0 0 20px;
      color: #f2bd16;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #f2bd16;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 55px 20px 35px;
    }

    .hero h2 {
      font-size: 38px;
      margin: 0 0 15px;
    }

    .hero p {
      max-width: 700px;
      margin: auto;
      color: #555;
      line-height: 1.7;
    }

    .about {
      max-width: 900px;
      margin: auto;
      padding: 45px 22px;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #666;
      font-weight: bold;
    }

    .about-card {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .about-image {
      display: none;
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 28px;
      background: #f7f7f7;
    }

    .about-card h3 {
      color: #123a8c;
      font-size: 27px;
      margin-top: 0;
    }

    .about-content p {
      color: #555;
      line-height: 1.8;
      font-size: 17px;
      margin: 0 0 20px;
    }

    .about-content p:last-child {
      margin-bottom: 0;
    }

    .about-button {
      display: none;
      margin-top: 25px;
      background: #f2bd16;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      padding: 13px 22px;
      border-radius: 8px;
    }

    .message {
      display: none;
      background: #fff4d6;
      color: #805b00;
      border: 1px solid #ead18a;
      padding: 14px;
      border-radius: 9px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    footer {
      margin-top: 40px;
      background: #123a8c;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    @media (max-width: 650px) {

      nav {
        gap: 12px;
      }

      .hero h2 {
        font-size: 31px;
      }

      .about {
        padding-left: 14px;
        padding-right: 14px;
      }

      .about-card {
        padding: 22px;
      }

      .about-card h3 {
        font-size: 24px;
      }

      .about-content p {
        font-size: 16px;
      }
    }

  </style>

</head>


<body>


<header>

  <h1>
    GiftedGift Empire
  </h1>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="shop.html">
      Shop
    </a>

    <a href="categories.html">
      Categories
    </a>

    <a href="blog.html">
      Blog
    </a>

    <a href="deals.html">
      Deals
    </a>

    <a href="about.html">
      About
    </a>

    <a href="contact.html">
      Contact
    </a>

    <a href="cart.html">
      🛒 Cart
    </a>

  </nav>

</header>


<section class="hero">

  <h2 id="page-title">
    About GiftedGift Empire
  </h2>

  <p id="hero-subtitle">
    Learn more about who we are and what GiftedGift Empire is created to do.
  </p>

</section>


<main class="about">

  <div
    id="message"
    class="message"
  ></div>


  <div
    id="loading"
    class="loading"
  >
    Loading About page...
  </div>


  <section
    id="about-card"
    class="about-card"
  >

    <img
      id="about-image"
      class="about-image"
      alt="GiftedGift Empire"
    >


    <h3 id="about-heading">
      Helping You Discover Better Finds
    </h3>


    <div
      id="about-content"
      class="about-content"
    ></div>


    <a
      id="about-button"
      class="about-button"
      href="#"
    ></a>

  </section>

</main>


<footer>

  <p>
    <strong>
      GiftedGift Empire
    </strong>
  </p>

  <p>
    © 2026 GiftedGift Empire.
    All rights reserved.
  </p>

</footer>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
></script>


<script>

  const SUPABASE_URL =
    "https://mvoxizdzjmtcvokowhpd.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


  const db =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const DEFAULT_CONTENT = {

    title:
      "About GiftedGift Empire",

    subtitle:
      "Helping You Discover Better Finds",

    content:
`GiftedGift Empire is a shopping and recommendation platform created to help people discover useful products, digital resources, lifestyle finds and carefully selected recommendations.

We feature our own products as well as products from trusted brands and partners. Some links on this website may be affiliate links, which means we may earn a commission when a purchase is made through certain links, at no additional cost to you.

Our goal is simple: to make product discovery easier, clearer and more helpful.`,

    image_url:
      null,

    button_text:
      null,

    button_url:
      null

  };


  function renderParagraphs(
    text
  ) {

    const container =
      document.getElementById(
        "about-content"
      );


    container.innerHTML =
      "";


    const paragraphs =
      String(
        text || ""
      )
        .split(
          /\n\s*\n/
        )
        .map(
          paragraph =>
            paragraph.trim()
        )
        .filter(Boolean);


    paragraphs.forEach(
      paragraph => {

        const p =
          document.createElement(
            "p"
          );


        p.textContent =
          paragraph;


        container.appendChild(
          p
        );
      }
    );
  }


  function renderAbout(
    data
  ) {

    const content =
      {
        ...DEFAULT_CONTENT,
        ...(data || {})
      };


    document.getElementById(
      "page-title"
    ).textContent =
      content.title ||
      DEFAULT_CONTENT.title;


    document.getElementById(
      "hero-subtitle"
    ).textContent =
      content.subtitle ||
      DEFAULT_CONTENT.subtitle;


    document.getElementById(
      "about-heading"
    ).textContent =
      content.subtitle ||
      DEFAULT_CONTENT.subtitle;


    renderParagraphs(
      content.content ||
      DEFAULT_CONTENT.content
    );


    const image =
      document.getElementById(
        "about-image"
      );


    if (
      content.image_url
    ) {

      image.src =
        content.image_url;


      image.style.display =
        "block";

    } else {

      image.removeAttribute(
        "src"
      );


      image.style.display =
        "none";
    }


    const button =
      document.getElementById(
        "about-button"
      );


    if (
      content.button_text &&
      content.button_url
    ) {

      button.textContent =
        content.button_text;


      button.href =
        content.button_url;


      button.style.display =
        "inline-block";

    } else {

      button.style.display =
        "none";
    }


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "about-card"
    ).style.display =
      "block";
  }


  async function loadAbout() {

    const {
      data,
      error
    } =
      await db
        .from(
          "site_content"
        )
        .select(
          "id,section,title,subtitle,content,button_text,button_url,image_url,updated_at"
        )
        .eq(
          "section",
          "about"
        )
        .maybeSingle();


    if (
      error
    ) {

      console.error(
        "About page error:",
        error
      );


      /*
        Keep the public About page usable
        even if Supabase temporarily fails.
      */

      renderAbout(
        DEFAULT_CONTENT
      );


      return;
    }


    if (
      !data
    ) {

      renderAbout(
        DEFAULT_CONTENT
      );


      return;
    }


    renderAbout(
      data
    );
  }


  loadAbout();

</script>


</body>

</html>
