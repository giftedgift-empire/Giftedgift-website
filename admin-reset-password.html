<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Reset Admin Password | GiftedGift Empire
</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background: #f4f6f8;

  color: #222;

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}


.reset-box {
  width: 100%;
  max-width: 420px;

  background: white;

  padding: 35px 28px;

  border-radius: 14px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,0.10);
}


h1 {
  text-align: center;

  color: #123a8c;

  margin-bottom: 8px;
}


.subtitle {
  text-align: center;

  color: #666;

  margin-bottom: 28px;

  line-height: 1.5;
}


label {
  display: block;

  margin-bottom: 8px;

  font-weight: bold;
}


input {
  width: 100%;

  padding: 13px;

  margin-bottom: 18px;

  border: 1px solid #ccc;

  border-radius: 7px;

  font-size: 16px;
}


button {
  width: 100%;

  padding: 14px;

  background: #f2bd16;

  color: #111;

  border: none;

  border-radius: 7px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}


button:hover {
  opacity: 0.9;
}


button:disabled {
  opacity: 0.6;

  cursor: not-allowed;
}


.message {
  margin-top: 18px;

  text-align: center;

  font-weight: bold;

  line-height: 1.5;
}


.message.success {
  color: #17662d;
}


.message.error {
  color: #9c1c1c;
}


.message.info {
  color: #123a8c;
}


.login-link {
  display: none;

  margin-top: 20px;

  text-align: center;
}


.login-link a {
  display: inline-block;

  padding: 12px 18px;

  border-radius: 7px;

  background: #123a8c;

  color: white;

  text-decoration: none;

  font-weight: bold;
}

</style>

</head>


<body>


<div class="reset-box">


  <h1>
    GiftedGift Empire
  </h1>


  <p class="subtitle">
    Create a new password for your administrator account.
  </p>


  <form id="reset-form">


    <label for="new-password">
      New Password
    </label>


    <input
      type="password"
      id="new-password"
      minlength="8"
      placeholder="Enter a new password"
      autocomplete="new-password"
      required
    >


    <label for="confirm-password">
      Confirm New Password
    </label>


    <input
      type="password"
      id="confirm-password"
      minlength="8"
      placeholder="Enter the new password again"
      autocomplete="new-password"
      required
    >


    <button
      type="submit"
      id="reset-button"
    >
      Change Password
    </button>


  </form>


  <p
    id="message"
    class="message info"
  >
    Verifying password reset link...
  </p>


  <div
    id="login-link"
    class="login-link"
  >

    <a href="admin.html">
      Return to Admin Login
    </a>

  </div>


</div>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
</script>


<script>


const SUPABASE_URL =
  "https://mvoxizdzjmtcvokowhpd.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_5wjUjC6amD7e2H_3h_7UQw_TY6orH16";


const ADMIN_USER_ID =
  "57a302e5-9a38-443b-8568-cc32c5a91bdf";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById(
    "reset-form"
  );


const newPassword =
  document.getElementById(
    "new-password"
  );


const confirmPassword =
  document.getElementById(
    "confirm-password"
  );


const resetButton =
  document.getElementById(
    "reset-button"
  );


const message =
  document.getElementById(
    "message"
  );


const loginLink =
  document.getElementById(
    "login-link"
  );


let recoveryReady =
  false;



function showMessage(
  text,
  type = "info"
) {

  message.textContent =
    text;

  message.className =
    "message " +
    type;

}



async function verifyRecoverySession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      error
    ) {

      throw error;

    }


    const session =
      data?.session;


    if (
      !session ||
      !session.user
    ) {

      form.style.display =
        "none";


      showMessage(
        "This password reset link is invalid or has expired. Please request a new reset link.",
        "error"
      );


      loginLink.style.display =
        "block";


      return;

    }


    if (
      session.user.id !== ADMIN_USER_ID
    ) {

      await supabaseClient
        .auth
        .signOut();


      form.style.display =
        "none";


      showMessage(
        "This password reset link does not belong to the administrator account.",
        "error"
      );


      loginLink.style.display =
        "block";


      return;

    }


    recoveryReady =
      true;


    showMessage(
      "Reset link verified. Enter your new password.",
      "success"
    );


  } catch (
    error
  ) {

    console.error(
      "Recovery verification error:",
      error
    );


    form.style.display =
      "none";


    showMessage(
      "The password reset session could not be verified.",
      "error"
    );


    loginLink.style.display =
      "block";

  }

}



form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (
      !recoveryReady
    ) {

      showMessage(
        "The password reset session is not ready.",
        "error"
      );

      return;

    }


    const password =
      newPassword.value;


    const confirmation =
      confirmPassword.value;


    if (
      password.length < 8
    ) {

      showMessage(
        "Your new password must contain at least 8 characters.",
        "error"
      );

      return;

    }


    if (
      password !== confirmation
    ) {

      showMessage(
        "The two passwords do not match.",
        "error"
      );

      return;

    }


    resetButton.disabled =
      true;


    showMessage(
      "Changing password...",
      "info"
    );


    try {


      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .updateUser({
            password:
              password
          });


      if (
        error
      ) {

        throw error;

      }


      if (
        !data?.user ||
        data.user.id !== ADMIN_USER_ID
      ) {

        throw new Error(
          "Administrator account verification failed."
        );

      }


      await supabaseClient
        .auth
        .signOut();


      form.style.display =
        "none";


      showMessage(
        "Password changed successfully. You can now sign in with your new password.",
        "success"
      );


      loginLink.style.display =
        "block";


    } catch (
      error
    ) {

      console.error(
        "Password update error:",
        error
      );


      showMessage(
        error.message ||
        "Your password could not be changed.",
        "error"
      );


      resetButton.disabled =
        false;

    }

  }
);



supabaseClient
  .auth
  .onAuthStateChange(
    async function(
      event,
      session
    ) {

      if (
        event ===
        "PASSWORD_RECOVERY"
      ) {

        if (
          session?.user?.id !==
          ADMIN_USER_ID
        ) {

          await supabaseClient
            .auth
            .signOut();


          form.style.display =
            "none";


          showMessage(
            "This reset link does not belong to the administrator account.",
            "error"
          );


          loginLink.style.display =
            "block";


          return;

        }


        recoveryReady =
          true;


        showMessage(
          "Reset link verified. Enter your new password.",
          "success"
        );

      }

    }
  );


verifyRecoverySession();


</script>


</body>

</html>
